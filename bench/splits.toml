contamination_reason = """
Same audit pass as the legal split: dev misses were decomposed by legend
separator (720 gold long forms, 230 missed, legend matches {'=': 102, ':': 13})
and the result was used to rank a recall proposal. Only `train.json` is unread.
"""
shortform_recall_ceiling_pct = 74.23
shortform_recall_ceiling_basis = """
Gold long-form spans divided by gold acronym spans, on dev: 720 / 970 = 74.23%.
Re-derived live from the pinned commit on 2026-08-23. Same mechanism as
[corpora.sdu22_ae_legal], and the same caveat: it is where an extractor whose
definitions match the annotation lands, NOT a bound. 265 of the 970 gold acronym
spans here (27.32%) exceed the definitions their own sample records, and any of
them can be recalled by emitting a definition the corpus does not annotate.
Every point above 74.23% is bought in long-form precision.

It decomposes the same way:
  scientific train   5,715 / 7,689 = 74.33%
  scientific dev       720 /   970 = 74.23%

The August 2026 audit measured short-form recall 57.84% here -- UN-GATED, from a
scratch runner, NOT in bench/results.json -- which is 77.9% of 74.23%. Against
the legal split's 68.5% of 55.15%, the two are far closer to each other than
their raw recalls (57.84 vs 37.76) suggest: MOST OF THE APPARENT DOMAIN GAP
BETWEEN THESE TWO SPLITS IS ANNOTATION DENSITY, NOT EXTRACTOR BEHAVIOUR. Quoting
the raw pair as domain evidence would attribute to the text a difference that
lives in how the two splits were annotated. Re-run both through a bench runner
with --save before publishing either.
"""

