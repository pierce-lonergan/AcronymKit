# reasons, and both are recorded on each entry below:
#
#   1. Both English test splits carry ZERO labels. Verified live 2026-08-23:
#      legal/test.json is 446 samples and 0 labelled; scientific/test.json is
#      498 samples and 0 labelled. The labels stayed on the CodaLab server. So
#      there is no blind split here to spend, only train and dev.
#
#   2. The dev splits are already contaminated. The August 2026 audit
#      decomposed their misses by legend separator -- 669 gold long forms, 263
#      missed, `{'=': 127, ':': 4}` on legal -- which is the same act that
#      contaminated MED1250. A corpus whose miss taxonomy has been read cannot
#      adjudicate anything blind, and pretending otherwise a week after the
#      audit said so would be remarkable.
#
# The train splits are unread and are the only honest blind arm this corpus
# offers. They are recorded as such rather than promoted to `role = "held_out"`,
# because the corpus is one artefact and the roles are declared per corpus.
#
# ***  BOTH train.json FILES ARE RESERVED, and as of this round the         ***
# ***  reservation REFUSES rather than asks. See the `[[...reservations]]`   ***
# ***  tables on the two entries below: legal/train is ALLOCATED (D-047),    ***
# ***  scientific/train is UNALLOCATED and its first spend needs its own     ***
