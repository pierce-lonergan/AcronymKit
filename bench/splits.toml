# Train/test separation for evaluation corpora.
#
# Frozen deliberately and committed before any configuration sweep, because the
# alternative is the failure mode this project has already paid for once: the
# v0.1.0 scoring presets were tuned against a model-authored lexicon, scored
# 16/16, and collapsed to 13/16 the moment real data arrived. Fitting to what
# you can see is cheap to do and expensive to discover.
#
# MED1250 is *already* contaminated as a test set. Its miss taxonomy has been
# read in detail (docs/EVALUATION.md categorises all 261 misses by cause), a
# long-form boundary experiment was run against it, and its failures shaped the
# roadmap. Nothing about it is blind any more. It is a tuning set now and it
# cannot be un-tuned.
#
# ---------------------------------------------------------------------------
# HOW TO READ THIS FILE, AND WHAT NOW READS IT
# ---------------------------------------------------------------------------
# `tools/splits.py` parses this file into typed objects and validates it.
# `bench/corpora.py` consults it when a corpus is loaded, so a reader cannot be
# registered for a corpus that was never declared. CI runs
# `python tools/splits.py --check`, and `tests/test_splits_manifest.py` drives
# the same validator. Before that existed, eleven places cited this file in
# prose and none of them parsed it -- and the file had been invalid TOML for
# months without anyone noticing, because noticing required a reader.
#
# Required of every corpus: `role`, `task`, `licence`, `licence_url`,
# `licence_read_on`.
#
# `task` is a CLOSED vocabulary -- extraction, span_detection, disambiguation,
# identifier_segmentation -- and it is closed because `bench/corpora.py` returns
# a DIFFERENT TYPE per task. A corpus filed under the wrong task is how a pair
# scorer comes to be pointed at a span corpus and report a meaningless zero.
# Widening it is a decision about that contract, never a one-word edit: see the
# identifier-segmentation block at the foot of this file.
#
# `task` is also what makes a headline claim answerable. `headline_capable()`
# takes the task the headline is ABOUT, because "this corpus is held out" and
# "this corpus can adjudicate the thing you are claiming" are different
# questions, and conflating them lets a corpus that scores where an identifier
# is cut back a claim about extracting definitions from prose.
#
# `licence_url` and `licence_read_on` are required because a bare `licence`
# string records a conclusion and destroys the evidence for it. This project
# has now recorded a corpus as more permissive than it is THREE times -- both
# SDU-21 entries, and GLADIS during the August 2026 audit -- and every
# correction came from a person opening the actual terms. So the terms get
# cited, with the date they were read, and `tools/splits.py` rejects a URL that
# points at a badge rather than at licence text.
#
# ---------------------------------------------------------------------------
# RESERVED ARMS -- operating rule 3, and it now REFUSES rather than asks
# ---------------------------------------------------------------------------
# A corpus can have one arm spoken for while the rest is free. Those arms are
# declared as `[[corpora.<name>.reservations]]` tables, one per arm, each
# naming:
#
#     arm            the split token a RUNNER passes ("train"), not a filename
#     state          allocated | unallocated | spent
#     decided_in     the D-record that put it in that state
#     allocated_to   the question it answers and who owns the read  (allocated)
#     spend_trigger  the event that would fire the spend            (required)
#     lapse_trigger  the event that releases it again               (allocated)
#     not_a_trigger  the near-misses, written down in advance       (optional)
#
# `tools/splits.py` validates all of that -- a reservation with no trigger, a
# state contradicting its own fields, two reservations claiming one arm, or an
# unrecognised key all fail `--check` -- and, more to the point, REFUSES A READ.
# `Corpus.require_unreserved(arm)` raises unless this process first called
# `Corpus.declare_spend(arm, decision="D-0nn", purpose="...")`.
#
# This replaces two prose reservations that refused nothing. D-043 and D-047
# each say so about themselves in their own "How it fails": a trigger written
# into a D-record is not a mechanism, and the guard was that somebody had to
# read a note. That is the same shape as the eleven prose citations of THIS
# FILE that nothing ever parsed.

[policy]
# Every headline number must come from a held-out corpus. Numbers from the
# tuning split are publishable but must be labelled "tuning split" wherever
# they appear -- in docs, in the README, and in bench/results.json run ids.
headline_requires = "held_out"
label_tuning_numbers = true

[corpora.med1250]
role = "tuning"
task = "extraction"
domain = "Biomedical (MEDLINE titles and abstracts)"
pairs = 1221
licence = "Public domain (United States Government Work)"
licence_url = "https://raw.githubusercontent.com/ncbi-nlp/Ab3P/41130cddfcba1449ba612905d4a51274f8f565a8/README.md"
licence_read_on = 2026-08-23
contaminated = true
contamination_reason = """
Miss taxonomy analysed in full; a boundary-selection experiment was run and
reverted against it; the configuration knobs that cost 17.6% of its misses were
identified from it. Any future number reported on MED1250 is a tuning number.
"""
note = """
LICENCE, read from the terms on 2026-08-23 at the URL above. The Ab3P README's
"Public Domain Notice" states the work "is a 'United States Government Work'
under the terms of the United States Copyright Act", that it "cannot be
copyrighted within the United States", and that "The National Library of
Medicine and the U.S. Government have not placed any restriction on its use or
reproduction." That is the widest grant any asset in this project carries.

Fetch-only anyway, and for a reason that is not the licence: it is a 1.6 MB
evaluation corpus, nothing in the library reads it, and shipping it would
inflate every wheel for the few people running benchmarks. See
tools/fetch_data.py, asset key `med1250`.
"""

# ---------------------------------------------------------------------------
# Held out for EXTRACTION: still empty, and saying so is the point.
# ---------------------------------------------------------------------------
# CORRECTION, 2026-08-24. This heading said "Held out: currently EMPTY" and the
# sentence under it said "NO number in this project satisfies
# `headline_requires`". Both were true when written and both had quietly gone
# false: `plod` and `sdu21_ai` are held-out span-detection corpora, and the
# identifier-segmentation entries at the foot of this file are held out too. The
# gap is real and it is PER TASK -- there is no held-out pair corpus and no
# held-out disambiguation corpus -- and a pooled statement of a per-task rule
# reports the union and hides every gap inside it. That is the same defect
# `headline_capable()` had in code until this round, where it was worse: a
# segmentation corpus would have satisfied a pair headline. `notes()` now prints
# the gap per task, so this comment can go stale without the check going quiet.
#
# There is no held-out short-form/long-form PAIR corpus yet, so no extraction
# number in this project satisfies `headline_requires`. That is a stated gap,
# not an oversight, and the reason is worth recording because it is not a matter
# of effort:
#
#   * BIOADI, MEDSTRACT and the original Schwartz & Hearst corpus are cited
#     everywhere but are not fetchable. The NCBI BioC conversion endpoint
#     (ftp.ncbi.nlm.nih.gov/pub/lu/ABBR/) returns 404 and BIOADI's SourceForge
#     project page is gone. "One BioC reader covers all four" is not available.
#
#   * SDU@AAAI-21 and PLOD are both reachable, but both are BIO token
#     classification: they label short-form and long-form *spans* without
#     pairing them. Deriving pairs requires an adjacency assumption, which would
#     make part of the "gold standard" mine. A gold standard I partly invented
#     cannot adjudicate my own system.
#
#   * SDU@AAAI-22 AE is now registered below and does NOT close this gap. Its
#     test splits carry zero labels, and its dev splits have already been mined
#     for a miss taxonomy. Read those two entries before assuming otherwise.
#
# Two honest routes forward, in preference order:
#   1. Score span-level detection on SDU/PLOD -- the metric those corpora were
#      actually built for -- which needs no pairing assumption. Different
#      metric, no invention.
#   2. Derive pairs by adjacency and label the corpus "derived pairing" in
#      every table it appears in, never mixing it with annotator-pair corpora.
#
# Until one lands, docs/EVALUATION.md says the extraction number is a tuning
# number.

# ---------------------------------------------------------------------------
# A THIRD ROUTE WAS BUILT, AND ITS PRODUCT IS DELIBERATELY NOT DECLARED HERE.
# ---------------------------------------------------------------------------
# `tools/build_gold_corpus.py` fetches, pools, samples and freezes an
# adjudicated PAIR corpus over Federal Register final rules -- the first
# instrument in this project that produces EDGES rather than spans, which is
# the shape D-048 established the flagship claim needs. It has been run end to
# end. There is a frozen artifact on disk, `bench.corpora.ReferenceSet` parses
# it, and `bench.corpora.read_federal_register_reference` will load it.
#
# NO `[corpora.<name>]` TABLE IS WRITTEN FOR IT, AND THAT IS THE DECISION.
# D-056 records it in full. The short version, because the temptation is one
# word wide and will recur:
#
#   * The artifact is a SINGLE-ANNOTATOR REFERENCE SET. It says so about
#     itself: `artifact_kind`, `is_gold_standard = false`,
#     `headline_eligible = false`, `adjudicator_count`, and a `role_note`
#     naming what ROLES cannot express. The adjudicator authored the extractor
#     that proposed most of the pool.
#
#   * `ROLES` is ("tuning", "held_out") and NEITHER IS TRUE OF IT.
#     `held_out` would make a self-adjudicated corpus headline-eligible
#     through `Manifest.headline_capable`, which is the one standing it must
#     never have -- filing it that way would fill this file's one honestly
#     empty slot with a corpus that cannot adjudicate anything.
#     `tuning` asserts something was fitted to it, and nothing was.
#     The documented escape is not available either: `role = "held_out"` with
#     `contaminated = true` is a HARD VALIDATION ERROR by validate()'s own
#     rule, because a contaminated corpus may not hold the headline role.
#
#   * It is also a PILOT and is NOT SCORABLE IN EITHER DIRECTION. A minority
#     of the pooled candidates are adjudicated and no document is exhaustively
#     annotated, so recall has an unknown denominator and precision is
#     understated -- an unsampled correct pair scores as a false positive.
#     `ReferenceSet.documents_for_scoring()` refuses on exactly those two
#     conditions. A corpus in this file is one `--save` away from a table.
#
# WHAT THE ENTRY NEEDS, so that whoever writes it does not have to re-derive
# this. `ROLES` must gain `single_annotator_reference`, taken as its own
# decision in `tools/splits.py`. `[policy] headline_requires` needs NO change:
# `headline_capable()` filters on the headline role and would exclude the new
# one automatically, which is the property that makes the widening safe.
# `bench/corpora.py` carries `UNREGISTERED_READERS` naming this reader and the
# reason it is held back, and `tests/test_build_gold_corpus.py` asserts that
# every name in that map is absent from THIS FILE -- so the moment an entry
# lands, that test goes red and says the exemption is no longer describing
# anything. Adding a table here without deleting the exemption is a broken
# build, on purpose.
#
# AND THE ROLE IS NOT THE ONLY BAR. Promotion to anything a headline could
# cite needs, in order: a second adjudicator who authored none of the pooled
# systems, with agreement computed and published; a written guideline settling
# long-form boundaries, contractions in legends, non-initialism defined terms
# and typesetting artefacts; EXHAUSTIVE adjudication of every pooled candidate
# in the documents to be scored; and an unproposed sample whose upper bound is
# small against the definitions found. An honest refusal to register beats a
# comfortable mislabel, and this is what the refusal looks like written down.

[corpora.sdu21_ai]
role = "held_out"
task = "span_detection"
status = "reader_not_written"
domain = "Scientific (computer-science papers)"
# CORRECTION. This said "MIT", which is the same error already caught and
# corrected on [corpora.sdu21_ad] and never propagated here. The repository
# ships an MIT LICENSE, but its README narrows the grant: MIT covers the
# evaluation script and the baseline, while the dataset is CC BY-NC-SA 4.0.
licence = "CC BY-NC-SA 4.0 (data); MIT (scorer and baseline only)"
licence_url = "https://raw.githubusercontent.com/amirveyseh/AAAI-21-SDU-shared-task-1-AI/master/README.md"
licence_read_on = 2026-08-23
vendorable = false
note = """
BIO tags over scientific-paper sentences; no annotator pairing.

LICENCE, read from the terms on 2026-08-23. The README's "# Licenses" section
reads, verbatim: "The dataset provided for this shared task is licensed under
CC BY-NC-SA 4.0 international license, and the evaluation script and the
baseline are licensed under MIT license." The repository root LICENSE, read the
same day, is a plain MIT licence naming "Copyright (c) 2020 amirveyseh" -- so a
reader who stops at the LICENSE file gets the wrong answer for the data, which
is precisely how this entry came to say MIT.

THE ERROR PROPAGATES DOWNSTREAM, and this is the part worth carrying forward.
The HuggingFace mirror `amirveyseh/acronym_identification` CONTRADICTS ITSELF
inside a single file. Verified live 2026-08-23 at
https://huggingface.co/datasets/amirveyseh/acronym_identification/raw/main/README.md :

    line   8  (YAML front-matter)  license:
    line   9                       - mit
    line 224  (### Licensing Information)
              "The dataset provided for this shared task is licensed under
               CC BY-NC-SA 4.0 international license."

The half that says `mit` is the MACHINE-READABLE half -- it is what the Hub's
licence filter indexes, what the dataset card badge renders, and what any tool
reading the card's metadata will believe. The half that is correct is prose
nobody parses. So anyone who trusts the badge inherits a non-commercial
share-alike corpus believing it to be MIT, and the two mistakes cancel to
silence rather than to an error. That is why `tools/splits.py` refuses a badge
host as a `licence_url`.
"""

[corpora.plod]
role = "held_out"
task = "span_detection"
status = "evaluated (span detection)"
domain = "Biomedical / life sciences (PLOS journal articles)"
licence = "CC BY-SA 4.0"
licence_url = "https://huggingface.co/datasets/surrey-nlp/PLOD-CW/resolve/c40ba1976a749d30fda147e11ed9030e1cd29354/LICENSE"
licence_read_on = 2026-08-23
vendorable = false
note = """
CORRECTION. This entry called PLOD a "non-biomedical counterweight". It is not.
PLOD is drawn from PLOS journal text and is dominated by the life sciences
(SDS-PAGE, shRNA, eicosapentaenoic acid). It is a different corpus, genre,
annotation provenance and task -- but it is not a different domain, and the
domain-generalisation gap this project keeps citing remains OPEN.

Evaluated on its own task (span detection, no derived pairing) rather than
forced into a pair format. Share-alike travels to Adapted Material, so a
statistics table derived from PLOD would inherit BY-SA -- which rules PLOD out
of the derived-term-frequency route as well as out of the wheel.

LICENCE, read from the terms on 2026-08-23 at the pinned URL above, which is
the deed itself and not a card, a badge or an SPDX id. Its first line is
"Attribution-ShareAlike 4.0 International"; section 3(b) is the share-alike
clause that reaches Adapted Material and therefore reaches any table derived
from the corpus. The URL is pinned to revision c40ba19 rather than to `main`,
because a dataset repository can be force-pushed and an unpinned licence
citation is a citation of whatever is there today.
"""

