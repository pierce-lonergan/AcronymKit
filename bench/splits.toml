# These two entries were parked as a comment block last round because `TASKS`
# in tools/splits.py had no value for them, and pasting them in would have made
# `python tools/splits.py --check` fail. Registering them therefore needed a
# decision about the task vocabulary rather than a patch to this file. That
# decision is recorded in docs/DECISIONS.md -- the record that widened `TASKS`
# with `identifier_segmentation` -- and the two consequences worth repeating
# here are:
#
#   1. `task` is a closed vocabulary BECAUSE bench/corpora.py returns a
#      different TYPE per task. `identifier_segmentation` is the first task in
#      this file whose gold is not an annotation inside a passage: a record is
#      a machine identifier and a human caption made of the SAME alphanumeric
#      characters, and the gold is the set of positions where one of them is
#      cut. No text, no span, no candidate set, no annotator.
#      bench/corpora.py returns `SegmentationCorpus` for it, which is not even
