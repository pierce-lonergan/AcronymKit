# ***  calls `Corpus.require_unreserved(split)` and raises; the only way     ***
# ***  past it is `declare_spend(arm, decision=..., purpose=...)`, which     ***
# ***  names the record and lands in the run log.                            ***
#
# THE DOMAIN LABEL IS THE CORPUS'S WORD, NOT A DESCRIPTION. See below.

[corpora.sdu22_ae_legal]
role = "tuning"
task = "span_detection"
# CORRECTED 2026-08-24. This read "registered; reader in bench/corpora.py; not
# yet scored through a runner" long after both were false. `status` is free
# text that tools/splits.py does not validate, which is how it went stale
# quietly -- the same failure class as the three published sentences D-037
# retired. If it goes stale again, delete it rather than fixing it: a field
# nothing checks is a field that lies eventually.
status = "evaluated; gated in bench/results.json under shortform.sdu22_ae_legal_dev.*"
# The corpus calls this split "legal". It is not legal text, and the field
# below says what it actually is. See `domain_finding`.
