forced into a pair format. Share-alike travels to Adapted Material, so a
statistics table derived from PLOD would inherit BY-SA -- which rules PLOD out
of the derived-term-frequency route as well as out of the wheel.

LICENCE, read from the terms on 2026-08-23 at the pinned URL above, which is
the deed itself and not a card, a badge or an SPDX id. Its first line is
"Attribution-ShareAlike 4.0 International"; section 3(b) is the share-alike
clause that reaches Adapted Material and therefore reaches any table derived
from the corpus. The URL is pinned to revision c40ba19 rather than to `main`,
because a dataset repository can be force-pushed and an unpinned licence
citation is a citation of whatever is there today.
"""

