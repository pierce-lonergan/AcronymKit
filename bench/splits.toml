licence = "CC BY-NC-SA 4.0 (data); MIT (scorer and baseline only)"
licence_url = "https://raw.githubusercontent.com/amirveyseh/AAAI-22-SDU-shared-task-1-AE/4a8f3b644c2824cf62e06907c8324fedc0941f24/README.md"
licence_read_on = 2026-08-23
vendorable = false
contaminated = true
contamination_reason = """
The August 2026 audit decomposed this split's misses by legend separator over
the 30 characters preceding each gold long-form span (669 gold long forms, 263
missed, legend matches {'=': 127, ':': 4}) and used the result to rank a recall
proposal. Reading a miss taxonomy is exactly what made MED1250 a tuning split.
Only `train.json` is unread.
"""
shortform_recall_ceiling_pct = 55.15
shortform_recall_ceiling_basis = """
Gold long-form spans divided by gold acronym spans, on dev: 669 / 1,213 =
55.15%. Re-derived live from the pinned commit on 2026-08-23, not copied from
the audit page.

WHAT IT IS. This corpus annotates every acronym OCCURRENCE, while acronymkit
reports only DEFINED PAIRS -- and every pair it emits carries exactly one long
form. The corpus records 669 definitions against 1,213 tagged acronym
occurrences, so an extractor whose emitted definitions are exactly the annotated
ones scores 55.15% short-form recall and no more.

AND WHAT IT IS NOT -- READ THIS BEFORE QUOTING IT. It is NOT a hard bound, and
saying so would be this project's own recorded mistake repeated. `41.53` was
published as "the ceiling of the feature set" and the same run exceeded it four
times; the August 2026 audit killed the word and kept the finding. The same
discipline applies here.

The escape route is real and it is large. 551 of the 1,213 gold acronym spans in
this split (45.42%) are in excess of the definitions their own sample records --
18 of them sit in samples with ZERO annotated long forms. An extractor can reach
any of those by emitting a definition the annotators did not mark: the acronym
span still scores as a short-form true positive, because short forms and long
forms are scored separately by the task's own scorer.

So the exact statement is: **every point of short-form recall above 55.15% here
is bought by emitting a definition this corpus does not annotate, which is paid
for in long-form precision.** That is decisive enough without being false --
long-form precision is what this library is for -- and it is the sentence that
belongs beside a recall figure, not the word "cannot".

IT DECOMPOSES, which is why it is corpus structure and not sample noise:
  legal train   5,246 / 9,532 = 55.04%
  legal dev       669 / 1,213 = 55.15%
Eleven hundredths of a point apart across a 7.9x change in sample size.

PRINT THIS BESIDE ANY RECALL FIGURE FROM THIS CORPUS. The August 2026 audit
measured short-form recall 37.76% here -- UN-GATED, from a scratch runner, NOT
in bench/results.json, and re-run it before building on it. Against 55.15% that
is 68.5% of what an annotation-matching extractor reaches, and quoting the raw
37.76 beside a biomedical figure measured on a pair corpus with no such
structure compares two different quantities.

The 55.15% itself is a COUNT OVER THE CORPUS, not a measurement of this library,
which is why it lives here rather than in bench/results.json. bench/corpora.py's
`sdu22_ae_recall_ceiling` recomputes it from the fetched files, so it is
checkable. Any acronymkit RECALL figure on this corpus is a different thing and
must go through a bench runner's --save before it is published anywhere.
"""
domain_finding = """
THE DOMAIN LABEL IS A FINDING, NOT A DESCRIPTION, AND THIS IS THE PLOD MISTAKE
WAITING TO BE MADE AGAIN. "Legal" is the corpus's own folder name. The text is
not legal text.

Verified 2026-08-23 by counting term occurrences across all 445 dev samples:

    "United Nations"   151 samples      statute       0 samples
    Committee           46              plaintiff     0
    environment         30              defendant     0
    Secretariat         23              tribunal      0
    Convention          19              litigation    0
    UNECE                8              judgment      0
    UNEP                 6              court         2

Zero occurrences of six of the most basic terms of legal practice, in a corpus
split named "legal", against 151 samples naming the United Nations.

IT DECOMPOSES, and it has a clean control. On train -- 3,564 samples, eight
times the dev sample -- the same ratio holds: "United Nations" 1,261 samples
(35.4%), against plaintiff 0, litigation 0, defendant 0, judgment 2, statute 10,
tribunal 20, court 27 (each under 0.8%). So it is a property of the split, not a
small-sample artifact. And the term is not a corpus-wide quirk: in the
"scientific" dev split, "United Nations" appears in ZERO of 497 samples. The two
splits really are different text; the "legal" one is simply not legal. A random
sample of twelve returns UNISDR/UNCCD drought and sand-storm coordination,
UNECE livestock statistics, Committee on the Rights of the Child country
reporting, an FAO forest resources assessment, UNCTAD working party procedure,
