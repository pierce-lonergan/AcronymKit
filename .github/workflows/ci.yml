name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        # `bench` is linted too. It was outside the check while holding every
        # benchmark runner -- the only writers of bench/results.json, which is
        # the file every published claim is verified against.
        run: python -m ruff check src tests tools bench
      - name: Ruff format check
        run: python -m ruff format --check src tests tools bench
      - name: Mypy
        run: python -m mypy
      - name: The train/test manifest parses, and every corpus cites its licence
        # bench/splits.toml is where operating rule 2 (MED1250 is a tuning
        # split) and operating rule 4 (licences come from terms, never a badge)
        # actually live. For months nothing read it: eleven citations in prose,
        # zero parsers -- and it had been invalid TOML the whole time, because a
        # `status` key was written twice inside [corpora.plod] while adding a
        # correction block. A governance artifact no tool reads is a habit.
        #
        # This runs the same validator that tests/test_splits_manifest.py drives
        # and that bench/corpora.py consults, so the three cannot disagree about
        # what "valid" means.
        run: python tools/splits.py --check
      - name: Every performance claim is backed by a measurement
        # A docstring once claimed an F1 that had never been measured. This is
        # the enforcement so the rule does not depend on catching it by hand.
        #
        # It now also enforces the value-matched ratchet: the 87 claims backed
        # only by "some measurement happens to equal this number" are
        # grandfathered per file and no new one may join them. That fallback
        # cannot tell a correct claim from a coincidence, which is how
        # "Headroom today is 113,269 bytes" survived two audits after the budget
        # it was derived under had been replaced. New claims cite a run id.
        run: python tools/check_claims.py
      - name: Every CI gate is registered, and says whether it has ever failed on purpose
        # THE REGISTER, AND WHY IT IS A GATE RATHER THAN A DOCUMENT.
        #
        # Four defects shipped in one round and every one was the same shape: a
        # check that could not fail in the environment where it ran (D-058).
        # The claims gate could not fail in a checkout holding every file it
        # scans; the suite could not fail on a machine holding data/ and
        # tools/; mypy could not fail against a click predating `match`; and
        # tests/test_splits_manifest.py had never once run in the extracted
        # tree, hiding 74 tests behind a green `build` job. None of the four
        # was found by a gate.
        #
        # .github/gates.toml registers every job in every workflow, what each
        # gate detects, what it is blind to, and whether its capacity to fail
        # has ever been demonstrated -- in situ, with a date. This step fails if
        # a job is added and not registered, if a gate points at a step that has
        # been renamed, or if a mutation is declared without edits or refused
        # without a reason.
        #
        # It prints, on every run, how many gates carry in-situ evidence. That
        # number started at zero and the line says so, because a register that
        # only reports its flattering totals is the document this repository
        # keeps finding stale.
        run: python tools/gates.py --check

  resources:
    name: Validate bundled resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e "."
      - name: Validate resource file formats
        run: python tools/validate_resources.py --require
      - name: Assert committed n-gram models match the lexicons
        run: python tools/build_ngram_model.py --check
      - name: Assert the bundled schema copy matches the canonical one
        # EXTRACTED FROM A HEREDOC, AND THE EXTRACTION IS THE POINT.
        # While this was six lines of Python inside this file there was no
        # command a mutation harness could invoke, so `.github/gates.toml`
        # carried `kind = "inline"` against it and the gate had never been shown
        # able to fail. `tools/gate_schema_copies.py` is the same six lines with
        # a name, and `python tools/gates.py --mutate schema_copies_match` now
        # runs it against a one-byte divergence.
        run: python tools/gate_schema_copies.py

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix affordable: only the edge interpreters on non-Linux.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: This runner is the environment the register says it is
        # A POSITIVE CONTROL FOR THIS JOB, AND THE REPOSITORY'S SECOND.
        #
        # `data/` is fetched and never committed, so all fifteen cells of this
        # job are already a run of the suite with the evaluation corpora
        # absent. Several tests depend on that absence -- D-058's cause one was
        # three controls that asserted on a resolved corpus path, green on a
        # machine that had fetched them and red on every runner.
        #
        # Nothing asserted the absence. A cached or vendored `data/` would turn
        # every gate that rests on it into a tautology, silently, and no other
        # check here would notice. `.github/gates.toml` declares what this
        # environment holds and lacks as globs, and this step checks them.
        #
        # The pattern is copied from the `air-gap` job below, which has opened
        # with "Prove the network namespace really has no route" since it was
        # written, for exactly this reason: without it, a runner where `unshare`
        # silently did nothing would turn every later step into a tautology
        # that passes. That job was the only one in this repository with a
        # positive control.
        #
        # SKIPPED ON 3.9 AND 3.10, AND THAT IS A HOLE RATHER THAN A DETAIL.
        # `tools/gates.py` needs a TOML parser; `tomllib` is 3.11+ and `tomli`
        # is not a declared dev dependency, so on those interpreters the tool
        # exits saying it cannot read the file rather than passing quietly. Four
        # of the fifteen cells therefore run without this control. Adding
        # `tomli` to the dev extra for `python_version < "3.11"` closes it in
        # one line of pyproject.toml; that file was not this workstream's to
        # edit, and the gap is registered in .github/gates.toml rather than
        # left to be discovered.
        if: matrix.python-version != '3.9' && matrix.python-version != '3.10'
        run: python tools/gates.py --assert-environment test
      - name: Test
        run: python -m pytest --cov=acronymkit --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  zero-dependency:
    name: Tier 0 has no optional imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install base package only (no extras)
        run: python -m pip install -e "."
      - name: Import and run without click, spaCy, NLTK or onnxruntime present
        # EXTRACTED FROM A HEREDOC. See the note on the resources job's schema
        # step: a gate whose implementation is a heredoc has no command a
        # mutation harness can invoke, so it could only ever run a copy of the
        # gate, and D-018 settled that a copy may not stand in for the thing.
        #
        # `tools/gate_tier_zero.py` asserts exactly what the heredoc asserted.
        # Its registered mutation is an eager `import click` at module scope in
        # `src/acronymkit/__init__.py`, and it fires through a DIFFERENT half of
        # the gate here than on a developer machine -- no extras are installed
        # on this runner, so the import raises rather than leaking. The script
        # routes both through one failure marker so the verdict does not depend
        # on which machine ran it.
        run: python tools/gate_tier_zero.py

  air-gap:
    name: No network, and a build that fails if that changes
    runs-on: ubuntu-latest
    # `zero-dependency` above proves a negative about sys.modules. This proves
    # a negative about sockets, which is a harder claim: a package can be
    # import-pure and still phone home, so the assertion has to be made against
    # the network primitives themselves rather than against the import graph.
    #
    # Three independent mechanisms, because each one alone has a hole:
    #
    #   1. an offline install from a local wheelhouse, so the artifact is
    #      proven usable by someone who has no package index at all;
    #   2. the entire test suite under tests/airgap_socket_guard.py, which
    #      fails the run the moment anything reaches for a socket -- including
    #      during collection and module import, which is when a phone-home
    #      would actually fire; and
    #   3. the public API and every CLI subcommand inside a real network
    #      namespace with no route, where being wrong about (1) or (2) surfaces
    #      as ENETUNREACH instead of as a quiet success.
    #
    # (2) and (3) are not redundant. The guard can only block calls that go
    # through the CPython entry points it patched; the namespace blocks
    # everything, including a C extension that opens a socket without asking
    # Python first. Neither one subsumes the other, so both run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prove the network namespace really has no route
        # A positive control for the harness, run before anything depends on
        # it. `sudo unshare -n` is only evidence if the namespace it creates is
        # actually empty, so the same connection has to succeed outside it and
        # fail inside it. Without this step, a runner where `unshare` silently
        # did nothing would turn every later step into a tautology that passes.
        run: |
          python - <<'PY'
          import socket
          import subprocess
          import sys

          with socket.create_connection(("pypi.org", 443), timeout=15):
              print("outside the namespace: connected to pypi.org:443")

          inside = (
              "import socket, sys\n"
              "try:\n"
              "    socket.create_connection(('pypi.org', 443), timeout=15).close()\n"
              "except OSError as exc:\n"
              "    print('inside the namespace:', type(exc).__name__, exc)\n"
              "    sys.exit(0)\n"
              "sys.exit('the namespace still has a route, so this job proves nothing')\n"
          )
          done = subprocess.run(
              ["sudo", "unshare", "-n", "--", sys.executable, "-c", inside],
              capture_output=True,
              text=True,
          )
          sys.stdout.write(done.stdout)
          sys.stderr.write(done.stderr)
          sys.exit(done.returncode)
          PY

      - name: Build the wheel and stage every dependency, while the network is up
        # Ordering is the whole trick. Everything that may legitimately touch an
        # index happens here, once, in the open: the build backend fetches its
        # own dependencies and pip resolves the dev extras. From the next step
        # onwards nothing is allowed to, and that is what is being tested.
        #
        # --only-binary is not a preference. A source distribution would have to
        # be *built* during the offline install, a build needs build
        # dependencies, and fetching those needs an index -- so admitting one
        # sdist would quietly reintroduce the requirement this job exists to
        # rule out. If this ever fails, a dependency has stopped publishing a
        # wheel. That is the finding, not a flake.
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          version=$(basename "$(ls dist/acronymkit-*.whl)" | cut -d- -f2)
          python -m pip download --dest wheelhouse --only-binary=:all: \
            --find-links dist "acronymkit[dev]==${version}"
          # acronymkit itself must come from the artifact just built. pip is
          # free to have pulled a same-version copy off an index while resolving
          # the self-referential `dev -> acronymkit[cli]` extra; deleting it
          # leaves dist/ as the only possible source and removes the ambiguity.
          rm -f wheelhouse/acronymkit-*
          echo "staged $(ls wheelhouse | wc -l) third-party wheels for acronymkit ${version}"

      - name: Install with no index and no route
        # The install is part of the claim, not a prerequisite to testing it: an
        # air-gapped operator has a wheelhouse and nothing else. --no-index
        # removes an index as a possibility and the namespace removes it as a
        # fact, so a dependency that quietly needs one fails here rather than in
        # their environment.
        #
        # `sudo unshare` must start as root to create the namespace; setpriv
        # drops straight back to the unprivileged runner user inside it, so
        # nothing here runs with privileges it would not have in production.
        # HOME points at a path that does not exist because "it just caches to
        # ~/.cache on first use" is the most common way a library turns out to
        # need the network after all -- with an unwritable HOME that fails
        # loudly instead of succeeding quietly.
        run: |
          python -m venv .airgap-venv
          sudo unshare -n -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            env HOME=/nonexistent PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_INPUT=1 \
            .airgap-venv/bin/python -m pip install --no-cache-dir --no-index \
              --find-links=dist --find-links=wheelhouse "acronymkit[dev]"

      - name: Show that the socket guard actually blocks
        # A guard with no positive control proves nothing: a renamed patch
        # target yields a green suite that checks nothing, which is worse than
        # no gate because it reads as evidence. This runs the guard's own
        # probes -- a real connect() to RFC 5737 TEST-NET-1 among them -- and
        # prints which primitives refused, so the log carries the proof next to
        # the suite it qualifies.
        run: .airgap-venv/bin/python tests/airgap_socket_guard.py

      - name: Run the full test suite with every socket primitive patched to raise
        # `-p` loads the guard before conftest is imported and before a single
        # test module is collected. That is the point of the flag: a package
        # that phones home does it at import time, and pytest-socket -- the
        # off-the-shelf answer -- patches in pytest_runtest_setup, which is
        # after collection. tests/airgap_socket_guard.py records the rest of
        # that reasoning, including the one documented exemption (asyncio's
        # Windows self-pipe is a loopback socketpair) and why it is narrow.
        #
        # Scope, stated so it is not read as more than it is: the wheelhouse is
        # built from `acronymkit[dev]`, which does not pull spaCy, NLTK or
        # onnxruntime, so the `nlp` tests skip here. What this proves is that
        # acronymkit and its Tier 0 / CLI path touch no socket. It says nothing
        # about what a third-party NLP backend does once installed, and it
        # cannot: staging those wheels offline would also have to stage their
        # models, which is the download this project refuses to make on a
        # user's behalf. `acronymkit.diagnostics.capabilities()` reports which
        # backends are present so an operator can make that call themselves.
        run: PYTHONPATH=tests .airgap-venv/bin/python -m pytest -p airgap_socket_guard

      - name: Exercise the whole public API with no route to anywhere
        # A path that is never called proves nothing about that path, so this
        # calls all of them: generation, scoring, tokenisation, extraction,
        # disambiguation (inferred and supplied dictionaries), backronyms,
        # synthesis, batch, async, schema load and validation, capabilities()
        # and every CLI subcommand including `doctor --offline`. It runs from
        # $RUNNER_TEMP so the checkout's src/ cannot shadow the installed wheel.
        run: |
          cat > "$RUNNER_TEMP/airgap_probe.py" <<'PY'
          """Call every public entry point with no route to anywhere.

          Run by the `air-gap` job inside `unshare -n`. Assertions are about
          behaviour, not smoke: each one would fail if the call had silently
          degraded rather than worked.
          """

          import asyncio
          import json
          import os
          from pathlib import Path

          # The harness, asserted rather than assumed.
          assert os.geteuid() != 0, "the probe must not run as root"
          home = os.environ.get("HOME", "")
          assert home, "HOME is unset, so nothing is being proven about writes to it"
          assert not os.access(home, os.W_OK), f"HOME={home!r} is writable"

          import acronymkit
          from acronymkit import (
              AcronymEngine,
              Config,
              ExpansionDictionary,
              capabilities,
              format_report,
          )
          from acronymkit.cli import main as cli_main
          from acronymkit.serialization import load_schema, validate_result

          installed = Path(acronymkit.__file__).resolve()
          assert "site-packages" in installed.parts, f"imported a checkout: {installed}"

          # The evidence, in the log, produced on a host with no route.
          print(format_report())
          print()

          DOCUMENT = (
              "The National Aeronautics and Space Administration (NASA) launched it. "
              "Blood pressure (BP) was elevated at admission."
          )

          engine = AcronymEngine()

          result = engine.generate("Portable Document Format")
          assert result.primary_acronym == "PDF", result.primary_acronym
          validate_result(result.to_dict())
          assert load_schema()["title"] == "AcronymEngineResult"

          candidate = engine.score("PDF", "Portable Document Format")
          assert candidate.acronym == "PDF", candidate.acronym
          assert engine.tokenize("Portable Document Format")

          pairs = engine.extract_definitions(DOCUMENT)
          assert any(pair.short_form == "NASA" for pair in pairs), pairs
          assert engine.extract(DOCUMENT).pairs

          inferred = engine.disambiguate("BP", DOCUMENT)
          assert inferred.primary_expansion == "Blood pressure", inferred.primary_expansion
          supplied = ExpansionDictionary({"ML": ["machine learning", "maximum likelihood"]})
          guided = engine.disambiguate("ML", "The ML model was trained on labelled data.", supplied)
          assert guided.primary_expansion in supplied.candidates("ML"), guided.primary_expansion

          backronym = engine.generate_backronym(
              "Next Generation High Performance Storage System", "NEXUS"
          )
          assert backronym.target_word == "NEXUS"
          assert engine.synthesize_backronym("NEXUS").target_word == "NEXUS"

          batch = engine.batch_generate(["Portable Document Format", "Random Access Memory"])
          assert batch.failure_count == 0, batch.errors
          assert asyncio.run(engine.agenerate("Portable Document Format")).primary_acronym == "PDF"
          async_batch = asyncio.run(
              engine.abatch_generate(["Portable Document Format", "Read Only Memory"])
          )
          assert async_batch.failure_count == 0, async_batch.errors

          report = capabilities()
          assert report["network"]["performs_network_io"] is False
          assert report["resources"]["count"] > 0, report["resources"]
          json.dumps(report)  # other people's CI is meant to assert on this

          document = Path(os.environ["RUNNER_TEMP"]) / "airgap_document.txt"
          document.write_text(DOCUMENT, encoding="utf-8")

          # The governed commands take a vocabulary the caller supplies, so the
          # probe has to supply one. Nothing governed ships in the wheel and
          # nothing about these commands may reach for a catalog on its own --
          # that is the point of them, and an air-gapped run is where a hidden
          # fetch would show up.
          catalog = Path(os.environ["RUNNER_TEMP"]) / "airgap_catalog.json"
          catalog.write_text(
              json.dumps(
                  [
                      {"token": "TXN", "canonical": "Transaction", "kind": "approved_abbrev",
                       "keep_as_abbrev": True, "source": "approved"},
                      {"token": "DT", "canonical": "Date", "kind": "class_word_abbrev",
                       "keep_as_abbrev": True, "class_word": "Date", "source": "approved"},
                  ]
              ),
              encoding="utf-8",
          )

          invocations = [
              ["version"],
              ["generate", "Portable Document Format"],
              ["generate", "Portable Document Format", "--format", "json"],
              ["score", "PDF", "Portable Document Format"],
              ["tokens", "Portable Document Format"],
              ["backronym", "Next Generation High Performance Storage System", "NEXUS"],
              ["synthesize", "NEXUS"],
              ["extract", str(document)],
              ["schema"],
              ["doctor"],
              ["doctor", "--offline"],
              ["doctor", "--offline", "--format", "json"],
              ["expand-token", "TXN", "--dictionary", str(catalog)],
              ["expand-token", "TXN", "--dictionary", str(catalog), "--format", "json"],
              ["expand-token", "TXN", "--dictionary", str(catalog),
               "--custom", '{"TXN": "Transfer"}'],
              ["expand-identifier", "TXN_DT", "--dictionary", str(catalog)],
              ["physical-name", "Transaction Date", "--dictionary", str(catalog)],
              ["check-name", "TXN_DT", "--dictionary", str(catalog)],
          ]
          for argv in invocations:
              code = cli_main(argv)
              assert code == 0, f"acronymkit {' '.join(argv)} exited {code}"

          # Strict offline mode, last, because it is process-wide: the env var
          # can only tighten, and a Config built under it must still work.
          os.environ["ACRONYMKIT_OFFLINE"] = "1"
          offline = AcronymEngine(Config())
          assert offline.config.offline is True
          assert offline.generate("Random Access Memory").primary_acronym == "RAM"

          print(f"air gap OK: {len(invocations)} CLI invocations and the full public API, no route")
          PY
          cd "$RUNNER_TEMP"
          sudo unshare -n -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            env HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 "RUNNER_TEMP=$RUNNER_TEMP" \
            "$GITHUB_WORKSPACE/.airgap-venv/bin/python" "$RUNNER_TEMP/airgap_probe.py"

  import-time:
    name: Cold import stays under its ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install base package only (no extras)
        # Not editable: an editable install adds a path finder of its own, and
        # what is being measured is what a user actually installs.
        run: python -m pip install .
      - name: Measure cold import in a subprocess and enforce the ceiling
        # EXTRACTED FROM A HEREDOC, WITH THE CEILING, THE REPEAT COUNT AND BOTH
        # HALVES MOVED UNCHANGED. A commit that both moves a gate and alters it
        # cannot say which of the two an altered verdict came from, so the
        # derivation of the 30 ms ceiling travelled with the code and is now in
        # `tools/gate_import_ceiling.py`'s module docstring.
        #
        # ONE DIVERGENCE IS REGISTERED RATHER THAN FIXED IN PASSING. Only the
        # STRUCTURAL half can be demonstrated by mutation: no edit to this tree
        # reliably takes a 2 ms import past 30 ms without breaking the structural
        # half first. R18 would have the wall-clock half be an unarmed note with
        # the machine named; changing that is a change to what CI enforces and
        # belongs in a commit that argues for it.
        run: python tools/gate_import_ceiling.py

  installed-suite:
    name: The suite runs from the installed distribution
    runs-on: ubuntu-latest
    # THE FIFTH FIX FOR THIS CLASS, AND THE FIRST THAT IS NOT A LIST OF NAMES.
    #
    # This distribution has broken four times on one shape: the artifact ships
    # an assertion without the thing that backs it. `bench/results.json`, then
    # `data/LICENSES.md`, then `tests/fixtures/*.json`, then a test that
    # executed `bench/run_governed_gold.py` while it was being imported. Every
    # fix named the file that had just broken, which is exactly why there was a
    # next one. `tests/test_packaging_manifest.py` derives one of those shapes
    # from the tree rather than from memory, which is the right direction; the
    # hand-written `required = [...]` in `build` below is still the wrong one.
    #
    # WHAT THIS JOB DOES NOT SEE, MEASURED RATHER THAN ASSUMED. Each of the five
    # historical breakages was reintroduced one at a time on a scratch copy of
    # the tree and run through this job's own command sequence:
    #
    #   un-gated, workstream measurement, 2026-08-24, CPython 3.13, Windows
    #   (`Scripts/python.exe` for `bin/python`), gate as written below. The
    #   third column is the `pytest -q -x` inside `build`'s extracted tree; the
    #   `test -f` lines that precede it in that step are counted separately.
    #                                                    THIS JOB  extracted  test -f
    #                                                              tree       lines
    #     a  bench/results.json out of the sdist          passes   FAILS      FAILS
    #     b  data/LICENSES.md out of the sdist            passes   passes     FAILS
    #     c  tests/fixtures/*.json out of the sdist       FAILS    FAILS      --
    #     d  test_governed_gold.py loads bench/ unguarded FAILS    FAILS      --
    #     e  test_splits_manifest.py     "        "       passes   FAILS      --
    #
    # It catches two of the five. `a` and `b` are invisible because the run
    # directory below holds `tests/` and `pyproject.toml` and nothing else --
    # there is no `bench/` and no `data/` here for their absence to be noticed
    # in, and the only test that reads `bench/results.json` is one of the two
    # that cannot collect at all.
    #
    # `e` is the one to read twice. It is the *same defect as `d`*, in a file
    # that is already on EXPECTED_NON_PASSING (now in
    # `tools/gate_installed_suite.py`), and it produced a log
    # identical to a clean run -- the same pass, skip, failure and error counts,
    # and the same eight entries "accounted for exactly". While a file is on
    # that list this job is blind to any new unshipped-path load inside it,
    # because the list is keyed on the file and the file was already going to
    # error. That is not a bug in
    # the gate -- it is what a list of names costs, and it is why the list is
    # meant to shrink. `d` and `e` both fail `build`'s extracted-tree step by
    # construction, verified with `tests/test_packaging_manifest.py` deleted
    # from the extracted tree so the failure could not be coming from a guard:
    # rc=1 on both, rc=0 on the unmutated tree.
    #
    # The AST guard in `tests/test_packaging_manifest.py` that used to cover
    # `d` and `e` was retired against that measurement. It matched a pattern,
    # it had missed the same class twice, and everything it caught the
    # extracted-tree step catches by executing the import. `b` is now held by
    # one `test -f` line in `build` and by nothing else.
    #
    # HOW THE RETIREMENT FAILS. It rests on `bench/*.py` staying out of the
    # sdist -- that absence is what makes the import raise in the extracted
    # tree. `MANIFEST.in` ships `bench/results.json` and nothing else from
    # `bench/`, and it says why. If a future commit ships the runners too, that
    # step stops seeing this class entirely and the only net left is this job,
    # blind in the two files above. Shipping `bench/*.py` is therefore a change
    # to a check, not just to a manifest.
    #
    # `build`'s "Verify the sdist can run its own test suite" step LOOKS like it
    # already covers the rest, and does not. It extracts the sdist, installs it,
    # and runs `pytest` inside the extracted tree -- with `src/` sitting beside
    # the tests. `tests/conftest.py` opens with
    #
    #     SRC = REPO_ROOT / "src"
    #     if SRC.is_dir() and str(SRC) not in sys.path:
    #         sys.path.insert(0, str(SRC))
    #
    # so `import acronymkit` resolves to the *source tree* and the install that
    # step just performed is never consulted. Measured inside a built, extracted
    # sdist by running that very conftest and asking where the import landed:
    #
    #   un-gated -- in <extracted-sdist>/tests, against a venv holding the
    #   installed sdist:
    #     python -c "import sys; sys.path.insert(0,'.');
    #                import conftest, acronymkit; print(acronymkit.__file__)"
    #     -> <extracted-sdist>/src/acronymkit/__init__.py
    #
    # That step proves the sdist SHIPS the files its own suite reads, which is
    # worth proving and is why it stays. It proves nothing whatever about the
    # distribution a user installs. This job is the missing half: the package
    # comes out of site-packages, the tests come out of the artifact, and the
    # run directory holds no source tree for either of them to fall back on.
    #
    # What that catches that nothing else here does. Delete
    # `acronymkit/resources/pseudo_precision_en.json` from an installed
    # distribution -- a resource the library reads at run time, and one the
    # hand-written `required = [...]` in `build` happens not to name:
    #
    #   un-gated -- local reproduction, 2026-08-24, CPython 3.13
    #     the `required = [...]` wheel-resource guard  no missing entries  PASSES
    #     the extracted-tree sdist run     4,308 passed, 102 skipped       PASSES
    #     this job                         15 failed (11 of them new)      FAILS
    #
    # Adding that one filename to `required` would have been the fifth symptom
    # fix. Nobody has to add anything here for the sixth.
    #
    # D-018 closes with "a lookup with a fallback cannot be used to test the
    # thing it falls back to". This is that rule one level up: a test suite
    # with a `sys.path` fallback to `src/` cannot be used to test the thing it
    # falls back to. Removing the fallback is what gives the run a second
    # operand, exactly as removing `load_schema()`'s search did.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the sdist
        # Built here rather than downloaded from `build`, so this job is
        # independent of the release path and fails on its own name. It is the
        # same tree, the same backend and the same pyproject.toml.
        run: |
          python -m pip install --quiet build
          python -m build --sdist
      - name: Install the sdist into a clean virtual environment
        # The sdist, not the wheel: installing it exercises the build backend
        # against the shipped source as well, so an sdist that cannot build is
        # a failure here rather than a surprise at release time.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          sdist="$(ls dist/*.tar.gz)"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "${sdist}[dev]"
          "$RUNNER_TEMP/venv/bin/python" -m pip show acronymkit
      - name: Lay out a run directory that is not a checkout
        run: |
          mkdir -p "$RUNNER_TEMP/sdist" "$RUNNER_TEMP/run"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          # The tests come from the ARTIFACT, not from the checkout: whatever
          # MANIFEST.in failed to ship is missing here for real.
          cp -r "$RUNNER_TEMP/sdist/tests" "$RUNNER_TEMP/run/tests"
          # pyproject.toml travels with them because it IS this suite's pytest
          # configuration -- `addopts`, the marker list that `--strict-markers`
          # is checked against, and `asyncio_mode = "auto"`. Running without it
          # is not a purer test, it is a different suite:
          #
          #   un-gated -- same run directory, pyproject.toml withheld
          #     32 failed, 4,192 passed  (against 4 failed, 4,220 passed)
          #     26 of the 28 extra failures are "async def functions are not
          #     natively supported" -- asyncio_mode was lost, not exercised
          #
          # It is one metadata file, it is not a source tree, and the assertion
          # in the next step is what holds that line.
          cp "$RUNNER_TEMP/sdist/pyproject.toml" "$RUNNER_TEMP/run/pyproject.toml"
          # The whole point. With no `src/` beside the tests, conftest's
          # `sys.path` insertion is a no-op and site-packages is the only
          # acronymkit in the process.
          test ! -e "$RUNNER_TEMP/run/src"
          ls -A "$RUNNER_TEMP/run"
      - name: The import must resolve to site-packages, not to a tree
        # Asserted before the suite runs, because every claim this job makes
        # rests on it. If `conftest.py` ever grows another way to put a source
        # directory first -- or if the layout above stops being isolated -- this
        # job would otherwise go on passing while testing a checkout, which is
        # precisely the state `build`'s sdist step has been in all along.
        working-directory: ${{ runner.temp }}/run
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import pathlib
          import sys
          import sysconfig

          sys.path.insert(0, str(pathlib.Path("tests").resolve()))
          import conftest  # noqa: F401 -- runs the real sys.path manipulation

          import acronymkit

          where = pathlib.Path(acronymkit.__file__).resolve()
          site = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          print(f"acronymkit resolved to: {where}")
          print(f"site-packages:          {site}")
          if site not in where.parents:
              sys.exit(
                  f"the suite would import acronymkit from {where}, which is not under "
                  f"{site}. This job only means anything when the installed distribution "
                  "is the one under test; a source tree has got into the run directory, "
                  "or tests/conftest.py has found a new way to put one on sys.path."
              )
          print("importing from the installed distribution")
          PY
      - name: Run the full suite against the installed package
        # How much of the suite actually runs here -- because a job that skips
        # most of what it collects is a green tick and nothing else.
        #
        # The COMPOSITION is structural and is what to read. Everything that
        # does not run does so for one of five reasons, and each is a named
        # file, not a mystery:
        #
        #   test_governed_gold.py       skips  -- `bench/` is deliberately not
        #                                          shipped; guarded already
        #   test_packaging_manifest.py  skips  -- needs MANIFEST.in
        #   test_pseudo_precision.py    skips  -- says "not a checkout" itself
        #   an optional NLP backend     skips  -- the same ones a checkout skips
        #   test_check_claims.py,       skips  -- each executes a `tools/`
        #   test_splits_manifest.py,               script at import, and
        #   test_build_gold_corpus.py              `tools/` is not shipped
        #
        # plus the six checkout-only tests enumerated in EXPECTED_NON_PASSING,
        # which lives in `tools/gate_installed_suite.py` and is invoked below.
        #
        # CORRECTED IN PLACE, AND THE CORRECTION IS THE INTERESTING PART.
        # That row read `never collect` for the first two files, which is what
        # they did until the round that shipped the note on EXPECTED_NON_PASSING:
        # a module body runs at import, so a `skipif` mark could not save
        # them and the file ERRORED rather than skipping. All three now call
        # `pytest.skip(..., allow_module_level=True)` on one named condition,
        # before the load. The note below was rewritten when that happened and
        # THIS LIST WAS NOT -- so one file asserted two different behaviours of
        # the same two test modules, sixty lines apart, and nothing could turn
        # red over it. Re-derive with:
        #   grep -l allow_module_level tests/*.py
        # which names exactly the three files above.
        #
        # The TOTALS move every time somebody adds a test, so they are stamped
        # rather than maintained, and the gate prints the current ones on every
        # run -- the same correction the wheel-size budget in `build` had to
        # make after its comment went stale twice:
        #
        #   un-gated -- 2026-08-24, CPython 3.13, one tree, both runs
        #     installed package: 4,218 passed  66 skipped  1 xfailed
        #                        4 failed  4 errors  120 never collected
        #     same tree, checkout: 4,402 passed  10 skipped  1 xfailed
        #     4,218 + 66 + 1 + 4 + 4 + 120 = 4,413, which is the whole suite
        #
        # 4,218 of 4,413 is 95.6 %, and 56 of the 66 skips are the "not a source
        # checkout" guards doing their job. This is not a job that proves
        # little. For scale, the extracted-tree run in `build` skips 102.
        working-directory: ${{ runner.temp }}/run
        env:
          # pytest truncates its short-summary lines to the terminal width, and
          # those lines are what the gate below parses.
          COLUMNS: "200"
        run: |
          set +e
          "$RUNNER_TEMP/venv/bin/python" -m pytest \
            --continue-on-collection-errors --tb=short -rfEs \
            > "$RUNNER_TEMP/pytest.log" 2>&1
          set -e
          cat "$RUNNER_TEMP/pytest.log"
          # THE ADJUDICATOR IS A SCRIPT, AND THE HARNESS THAT REPRODUCES THIS
          # JOB NOW IMPORTS IT RATHER THAN RE-IMPLEMENTING IT.
          #
          # `EXPECTED_NON_PASSING`, `PASS_FLOOR` and the log parser used to live
          # in a heredoc here AND in a second copy inside
          # `tools/gate_packaging_mutation.py`, so the packaging mutation job
          # could reproduce this step. A harness that re-implements a gate is
          # testing its own copy, and the drift detector that existed for it
          # (`check_expected_non_passing_is_current`) only WARNED. There is one
          # implementation now and nothing left to drift.
          #
          # Run with the RUNNER's python, not the venv's: the script is
          # standard-library only, and invoking it with the venv interpreter
          # would put `$GITHUB_WORKSPACE/tools` on that interpreter's sys.path
          # -- a source directory, in the one job whose whole premise is that no
          # source directory is reachable.
          python "$GITHUB_WORKSPACE/tools/gate_installed_suite.py" "$RUNNER_TEMP/pytest.log"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test, resources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Enforce the wheel size budget
        run: |
          python - <<'PY'
          import glob
          import os
          import sys
          import zipfile

          # Why 768 KiB, and why the previous 512 KiB stopped being right.
          #
          # The 512 KiB budget was derived when the wheel was 411,019 B and
          # rested on one premise: lexicon_en.txt was 51.6% of the compressed
          # payload, so the budget was "really a budget on how much word list
          # ships, and everything else is noise against it".
          #
          # That premise is now false, and the honest response is to re-derive
          # the number rather than nudge it. acronymkit/governed/ added 68,167 B
          # of pure Python across 10 modules -- 13.9% of the wheel, and not
          # noise by any reading. The wheel reached 491,293 B, 93.7% of the old
          # budget, with 32,995 B left. A budget with 6% headroom does not
          # express an intention; it just fails on the next ordinary commit.
          #
          # 786,432 B is chosen so the gate still does the ONE job it was built
          # for. The change it exists to reject is an LRABR-derived expansion
          # dictionary, measured during the offline audit at 402.7 KB gzipped
          # for the tightest useful shape and 1.4 MB for the full dump. Adding
          # the tightest of those to today's wheel reaches ~894 KB, which is
          # over this ceiling -- so it still fails by construction, which is the
          # whole point. Everything anyone has actually proposed fits; the one
          # thing that would change the character of the distribution does not.
          #
          # The 10 MB originally proposed was rejected and still is. It is 20x
          # this wheel; nothing anyone has proposed could reach it. A ceiling
          # that cannot be hit is not a budget, it is a permission slip, and it
          # would admit every dictionary above in silence.
          #
          # Raising this number is a decision about what may ship. Read the
          # largest entries printed below before making it, and re-derive the
          # rationale rather than editing the constant -- that is what went
          # stale last time.
          #
          # And it went stale again, here, in the comment that says so. This
          # block used to end "Headroom is now 295,139 B, and the largest .py in
          # the wheel compresses to 18,856 B, so that is roughly fifteen more
          # modules of the biggest size currently present." Both figures were
          # derived when the wheel was 491,293 B. Re-derived 2026-08-23 against
          # `python -m build --wheel`, the wheel is 565,730 B, headroom is
          # 220,702 B, and the largest .py is acronymkit/cli.py at 31,468 B
          # compressed -- so it is about SEVEN more modules of the biggest size
          # present, not fifteen.
          #
          # Which is why the numbers are no longer written down here. A figure
          # in a comment goes stale silently; a figure the gate computes and
          # prints on every run cannot. Headroom is printed below. The same
          # correction is applied to D-020 in docs/DECISIONS.md, which carried
          # the 113,269 B figure from the *previous* budget in two places and
          # had it re-quoted as current by two independent auditors.
          BUDGET_BYTES = 786_432

          wheel = glob.glob("dist/*.whl")[0]
          size = os.path.getsize(wheel)
          entries = sorted(
              zipfile.ZipFile(wheel).infolist(), key=lambda item: -item.compress_size
          )
          modules = [e for e in entries if e.filename.endswith(".py")]
          print(f"{wheel}: {size} B of {BUDGET_BYTES} B ({size / BUDGET_BYTES:.1%} of budget)")
          print(f"headroom: {BUDGET_BYTES - size} B")
          if modules:
              biggest = modules[0]
              print(
                  f"largest module: {biggest.filename} at {biggest.compress_size} B compressed, "
                  f"so headroom is ~{(BUDGET_BYTES - size) // biggest.compress_size} more of that size"
              )
          print("largest entries, compressed:")
          for item in entries[:5]:
              print(f"  {item.compress_size:>9} B  {item.filename}")
          if size > BUDGET_BYTES:
              sys.exit(
                  f"wheel is {size} B, over the {BUDGET_BYTES} B budget by "
                  f"{size - BUDGET_BYTES} B."
              )
          print("wheel size OK")
          PY
      - name: Verify bundled resources are present in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "acronymkit/py.typed",
              "acronymkit/resources/acronym-engine-result.schema.json",
              # Only English ships a lexicon and n-gram model; the other
              # languages' sources are copyleft. See data/LICENSES.md.
              "acronymkit/resources/lexicon_en.txt",
              "acronymkit/resources/ngram_en.json",
          ]
          for lang in ("en", "fr", "es", "de"):
              required.append(f"acronymkit/resources/stopwords_{lang}.json")
          missing = [r for r in required if r not in names]
          assert not missing, f"missing from wheel: {missing}"
          print(f"{wheel}: {len(names)} entries, all {len(required)} required resources present")
          PY
      - name: Verify the installed wheel works without a source checkout
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --quiet dist/*.whl jsonschema
          cd /tmp
          /tmp/wheelenv/bin/python - <<'PY'
          from acronymkit import AcronymEngine
          from acronymkit.serialization import load_schema, validate_result

          engine = AcronymEngine()
          result = engine.generate("Portable Document Format")
          assert result.primary_acronym == "PDF", result.primary_acronym
          # load_schema() must resolve from the bundled resource, not the checkout.
          assert load_schema()["title"] == "AcronymEngineResult"
          validate_result(result.to_dict())
          print("installed wheel OK:", result.primary_acronym)
          PY
      - name: Verify the sdist ships the files its own test suite reads
        # Renamed, because what it verifies is narrower than what it was called.
        # This runs `pytest` inside the EXTRACTED TREE, where `src/` is sitting
        # beside the tests -- and `tests/conftest.py` puts that `src/` on
        # `sys.path` ahead of everything, so `import acronymkit` never reaches
        # the install performed on the last line. Measured: the conftest-driven
        # import inside a built, extracted sdist resolves to
        # `<extracted-sdist>/src/acronymkit/__init__.py`.
        #
        # That still proves something real and worth keeping: every file this
        # suite reads is present in the artifact, which is the failure that has
        # bitten four times. It is not a check on the installed distribution.
        # The `installed-suite` job above is that check, and the difference
        # between the two is the reason both exist.
        #
        # DO NOT DELETE THIS STEP AS REDUNDANT WITH THAT JOB. It is now the
        # ONLY mechanism covering the module-level-unshipped-load shape, and it
        # covers more of the five historical breakages than `installed-suite`
        # does -- four of five against two of five, measured; the table is in
        # that job's comment. `tests/test_packaging_manifest.py` used to hold an
        # AST guard for two of them and was retired against this step, on the
        # evidence that deleting the guard from the extracted tree left both
        # cases failing here anyway, by import rather than by pattern. The `test
        # -f` lines are now `tools/gate_sdist_files.py`; they are still a list
        # of names and still the wrong shape, but `data/LICENSES.md` is held by
        # one of them and by nothing else in this repository: deleting that
        # entry removes the only check on it.
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          # THE FILE LIST IS A SCRIPT, FOR THE SAME REASON THE ADJUDICATOR IN
          # `installed-suite` IS. `tools/gate_packaging_mutation.py` carried a
          # copy of these five names so it could reproduce this step; it imports
          # them now. The list is still a list of names and that is still the
          # wrong shape -- what catches the rest is the pytest run below.
          python tools/gate_sdist_files.py /tmp/sdist
          cd /tmp/sdist && python -m pip install --quiet ".[dev]" && python -m pytest -q -x
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
