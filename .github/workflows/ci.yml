name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests tools
      - name: Ruff format check
        run: python -m ruff format --check src tests tools
      - name: Mypy
        run: python -m mypy
      - name: Every performance claim is backed by a measurement
        # A docstring once claimed an F1 that had never been measured. This is
        # the enforcement so the rule does not depend on catching it by hand.
        run: python tools/check_claims.py

  resources:
    name: Validate bundled resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e "."
      - name: Validate resource file formats
        run: python tools/validate_resources.py --require
      - name: Assert committed n-gram models match the lexicons
        run: python tools/build_ngram_model.py --check
      - name: Assert the bundled schema copy matches the canonical one
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          canonical = pathlib.Path("schemas/acronym-engine-result.schema.json")
          bundled = pathlib.Path("src/acronymkit/resources/acronym-engine-result.schema.json")
          digests = {p: hashlib.sha256(p.read_bytes()).hexdigest() for p in (canonical, bundled)}
          if len(set(digests.values())) != 1:
              for path, digest in digests.items():
                  print(f"{digest}  {path}")
              sys.exit(
                  "schemas/ and the bundled resource copy have diverged. "
                  f"Run: cp {canonical} {bundled}"
              )
          print(f"schema copies match ({digests[canonical][:16]})")
          PY

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix affordable: only the edge interpreters on non-Linux.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=acronymkit --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  zero-dependency:
    name: Tier 0 has no optional imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install base package only (no extras)
        run: python -m pip install -e "."
      - name: Import and run without click, spaCy, NLTK or onnxruntime present
        run: |
          python - <<'PY'
          import sys
          from acronymkit import AcronymEngine, Config
          from acronymkit.enums import EngineTier

          engine = AcronymEngine(Config(engine_tier=EngineTier.ZERO_DEPENDENCY))
          result = engine.generate("Portable Document Format")
          print(result.primary_acronym, result.score)
          assert result.primary_acronym == "PDF", result.primary_acronym

          pairs = engine.extract_definitions(
              "The National Aeronautics and Space Administration (NASA) launched it."
          )
          assert pairs and pairs[0].short_form == "NASA", pairs

          leaked = sorted(m for m in sys.modules if m.split(".")[0] in
                          {"spacy", "nltk", "click", "onnxruntime", "transformers", "numpy"})
          assert not leaked, f"Tier 0 pulled in optional dependencies: {leaked}"
          print("Tier 0 purity OK")
          PY

  import-time:
    name: Cold import stays under its ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install base package only (no extras)
        # Not editable: an editable install adds a path finder of its own, and
        # what is being measured is what a user actually installs.
        run: python -m pip install .
      - name: Measure cold import in a subprocess and enforce the ceiling
        run: |
          python - <<'PY'
          import json
          import statistics
          import subprocess
          import sys

          # Why 30 ms.
          #
          # `import acronymkit` measures 2.3 ms on the development box
          # (bench/results.json, micro.import.cold_import_ms), nearly all of it
          # `typing`; the package __init__ is a lookup table and two functions.
          # The regression this gate exists to catch is the Pydantic DTO layer
          # being re-exported eagerly again, which measures 128.1 ms on that
          # same box (micro.import.cold_import_engine_ms) and would be worse on
          # a shared runner.
          #
          # So the ceiling only has to separate ~2 ms from ~130 ms, and 30 ms
          # sits in the middle of that two-order-of-magnitude gap: 13x headroom
          # over what we achieve -- enough to absorb a slow runner, a cold page
          # cache and first-import bytecode compilation -- and still 4x below
          # the regression. It is deliberately *not* a certification of the
          # measured figure; that is bench/run_micro.py's job, and its numbers
          # live in bench/results.json where claims can cite them.
          #
          # If this ever fires, read the median printed below before touching
          # the ceiling: a real regression lands near 130 ms, not near 31.
          CEILING_MS = 30.0
          REPEATS = 9

          timed = (
              "import time;"
              "t = time.perf_counter();"
              "import acronymkit;"
              "print(time.perf_counter() - t)"
          )
          samples = []
          for _ in range(REPEATS):
              out = subprocess.run(
                  [sys.executable, "-c", timed], capture_output=True, text=True, check=True
              )
              samples.append(float(out.stdout.strip()) * 1000)
          samples.sort()
          median = statistics.median(samples)
          print("samples (ms): " + ", ".join(f"{s:.2f}" for s in samples))
          print(f"median {median:.2f} ms, ceiling {CEILING_MS:.0f} ms")

          # The structural half of the gate, which cannot be flaky: a bare
          # import must not have built a single Pydantic schema.
          probe = (
              "import sys, json;"
              "import acronymkit;"
              "print(json.dumps(sorted(m for m in sys.modules"
              " if m == 'pydantic' or m.startswith('acronymkit.'))))"
          )
          out = subprocess.run(
              [sys.executable, "-c", probe], capture_output=True, text=True, check=True
          )
          eager = json.loads(out.stdout.strip())
          print(f"bound by a bare import: {eager}")

          if eager:
              sys.exit(
                  f"`import acronymkit` eagerly bound {eager}. The package __init__ must "
                  "resolve its re-exports lazily; see its Import policy docstring."
              )
          if median > CEILING_MS:
              sys.exit(
                  f"cold import regressed to {median:.2f} ms, over the {CEILING_MS:.0f} ms "
                  "ceiling. Something was added to acronymkit/__init__.py at module scope."
              )
          print("cold import OK")
          PY

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test, resources]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Verify bundled resources are present in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "acronymkit/py.typed",
              "acronymkit/resources/acronym-engine-result.schema.json",
              # Only English ships a lexicon and n-gram model; the other
              # languages' sources are copyleft. See data/LICENSES.md.
              "acronymkit/resources/lexicon_en.txt",
              "acronymkit/resources/ngram_en.json",
          ]
          for lang in ("en", "fr", "es", "de"):
              required.append(f"acronymkit/resources/stopwords_{lang}.json")
          missing = [r for r in required if r not in names]
          assert not missing, f"missing from wheel: {missing}"
          print(f"{wheel}: {len(names)} entries, all {len(required)} required resources present")
          PY
      - name: Verify the installed wheel works without a source checkout
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --quiet dist/*.whl jsonschema
          cd /tmp
          /tmp/wheelenv/bin/python - <<'PY'
          from acronymkit import AcronymEngine
          from acronymkit.serialization import load_schema, validate_result

          engine = AcronymEngine()
          result = engine.generate("Portable Document Format")
          assert result.primary_acronym == "PDF", result.primary_acronym
          # load_schema() must resolve from the bundled resource, not the checkout.
          assert load_schema()["title"] == "AcronymEngineResult"
          validate_result(result.to_dict())
          print("installed wheel OK:", result.primary_acronym)
          PY
      - name: Verify the sdist can run its own test suite
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          test -f /tmp/sdist/tests/conftest.py || { echo "conftest.py missing from sdist"; exit 1; }
          test -f /tmp/sdist/schemas/acronym-engine-result.schema.json || { echo "schemas/ missing from sdist"; exit 1; }
          test -f /tmp/sdist/bench/results.json || { echo "bench/results.json missing from sdist: the shipped docs make claims the shipped checker then cannot back"; exit 1; }
          cd /tmp/sdist && python -m pip install --quiet ".[dev]" && python -m pytest -q -x
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
