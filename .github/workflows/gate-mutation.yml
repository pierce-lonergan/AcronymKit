name: Gate mutation

# WHAT THIS IS FOR.
#
# Four defects shipped in one round and every one was the same shape: a check
# that could not fail in the environment where it ran (D-058). The claims gate
# could not fail in a checkout holding every file it scans. The suite could not
# fail on a machine holding `data/` and `tools/`. Mypy could not fail against a
# `click` predating `match`. `tests/test_splits_manifest.py` had never once run
# in the extracted tree, hiding 74 tests behind a green `build` job.
#
# A green tick was read as evidence and was not evidence, because nobody had
# established that the tick could go red. This workflow establishes it: for each
# gate registered in `.github/gates.toml`, it applies a declared defect IN THAT
# GATE'S OWN ENVIRONMENT, requires the gate to fail, puts the tree back, and
# requires the gate to pass again. The captured failure is uploaded.
#
# WHY ON A SCHEDULE AND NOT ONCE. A demonstration taken once is a claim about a
# tree that no longer exists. Three of the four defects above were invisible on
# a developer machine and visible on a runner; the environments this asserts
# about are runner images that change weekly, and a dependency that floats can
# turn a live gate inert without a commit here -- which is exactly what happened
# to mypy. Weekly, so the evidence carries a date near today's.
#
# WHAT A RED RUN MEANS. `INERT` is the finding: the gate ran against a tree
# carrying the defect it exists to catch and did not fail. That is not a bug in
# this workflow, it is the workflow doing the one thing it was built for.
# `UNRESTORED` means the gate was already failing before the mutation, so the
# failure proves nothing -- read that as a broken checkout, not a broken gate.
#
# WHERE THE REGRESS STOPS. See `[manifest].stops_at` in `.github/gates.toml`.
# The `controls` job below is a positive and a negative control on this
# harness's own detector; a harness rotted into reporting success for
# everything fails the negative control and reddens this run, which a human sees
# in the Actions tab. Nothing here detects a scheduled workflow that stops
# running altogether, and that is written down rather than implied.

on:
  schedule:
    # Weekly, Mondays 03:17 UTC. Off the hour on purpose: the top of the hour is
    # the busiest slot on GitHub's scheduler and a delayed run is a run whose
    # date is wrong.
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    # Also on any change to the register, the harness, or the workflows it
    # describes -- because those are the three edits that can make a recorded
    # demonstration stop describing the thing it names.
    paths:
      - ".github/gates.toml"
      - ".github/workflows/*.yml"
      - "tools/gates.py"
      - "tests/test_gate_manifest.py"

permissions:
  contents: read

concurrency:
  group: gate-mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  controls:
    name: Controls on the harness itself
    runs-on: ubuntu-latest
    # RUN FIRST AND FAIL LOUD. Every other job in this workflow reports
    # `demonstrated` or `INERT`, and both readings are worthless if the detector
    # producing them is broken. These two gates check the detector in both
    # directions: one mutation that MUST be seen as a failure, and one that MUST
    # NOT be. A harness that has silently become a no-op passes the first and
    # fails the second.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Positive control - a mutation that must be demonstrated
        run: python tools/gates.py --mutate control_always_red --artifacts artifacts
      - name: Negative control - a mutation that must NOT be demonstrated
        run: python tools/gates.py --mutate control_always_green --artifacts artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-mutation-controls
          path: artifacts/
          if-no-files-found: error

  lint-gates:
    name: Mutate the lint gates, in the lint environment
    runs-on: ubuntu-latest
    needs: [controls]
    # THE ENVIRONMENT IS THE POINT. This job installs exactly what `ci.yml`'s
    # `lint` job installs, on the same runner image and the same interpreter, so
    # a mutation demonstrated here is demonstrated where the gate runs. Running
    # the same mutation on a laptop is what R11 says does not count -- and the
    # mypy gate below is the reason the rule is worded that way: at the 3.9
    # floor mypy follows imports into installed third-party source, and whether
    # this gate is alive depends on which `click` pip resolved this morning.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mutate every automated gate of ci.yml's lint job, in that environment
        # `--assert-environment lint` runs first inside the same step so the
        # premise is checked before anything claims to have demonstrated
        # something here. This is `air-gap`'s namespace control, generalised.
        run: |
          python tools/gates.py --assert-environment lint
          python tools/gates.py --mutate-environment lint --artifacts artifacts
          python tools/gates.py --mutate harness_lint_environment --artifacts artifacts
      - name: Record what pip actually resolved
        # A gate that depends on a floating dependency is only as demonstrated
        # as the version it was demonstrated against. mypy at the 3.9 floor
        # follows `click` into source; the version matters and belongs in the
        # artifact rather than in someone's memory.
        if: always()
        run: |
          mkdir -p artifacts/lint
          python -VV > artifacts/lint/resolved.txt
          python -m pip freeze >> artifacts/lint/resolved.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-mutation-lint
          path: artifacts/
          if-no-files-found: error

  resource-gates:
    name: Mutate the resource gates, in the resources environment
    runs-on: ubuntu-latest
    needs: [controls]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e "."
      - name: Mutate every automated gate of ci.yml's resources job
        run: python tools/gates.py --mutate-environment resources --artifacts artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-mutation-resources
          path: artifacts/
          if-no-files-found: error

  zero-dependency-gates:
    name: Mutate ci.yml's zero-dependency gate, in that environment
    runs-on: ubuntu-latest
    needs: [controls]
    # THE INSTALL MODE IS THE ENVIRONMENT, AND FOR THIS GATE IT IS THE WHOLE
    # PREMISE. `ci.yml`'s `zero-dependency` job installs `-e "."` with no
    # extras. Both halves matter here: EDITABLE, so an edit to
    # `src/acronymkit/__init__.py` reaches the interpreter the gate measures --
    # measured, on a developer machine where acronymkit happened to be
    # installed NON-editably, the same mutation came back INERT because the
    # harness had not touched what the gate looks at -- and NO EXTRAS, because
    # the registered mutation is an eager `import click` and it fires the
    # gate's "Tier 0 must run at all" half here rather than its leak half.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install base package only (no extras), editable
        run: python -m pip install -e "."
      - name: Mutate every automated gate of ci.yml's zero-dependency job
        run: python tools/gates.py --mutate-environment zero_dependency --artifacts artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-mutation-zero-dependency
          path: artifacts/
          if-no-files-found: error

  import-time-gates:
    name: Mutate ci.yml's import-time gate, in that environment
    runs-on: ubuntu-latest
    needs: [controls]
    # NOT EDITABLE, DELIBERATELY, AND THAT IS WHY THIS GATE NEEDED A NEW FIELD.
    # `ci.yml`'s `import-time` job installs `python -m pip install .` because
    # "an editable install adds a path finder of its own, and what is being
    # measured is what a user actually installs". So a source edit does not
    # reach this gate at all, and the mutation would have been inert here BY
    # CONSTRUCTION -- reading as a blind gate when the harness had simply not
    # touched what the gate looks at. `gates.import_ceiling.mutation.setup`
    # re-installs the mutated source the way this job installs it, before the
    # gate runs and again after the restore.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install base package only (no extras), not editable
        run: python -m pip install .
      - name: Mutate every automated gate of ci.yml's import-time job
        run: python tools/gates.py --mutate-environment import_time --artifacts artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-mutation-import-time
          path: artifacts/
          if-no-files-found: error

  test-gates:
    name: Mutate ci.yml's test job on one cell
    runs-on: ubuntu-latest
    needs: [controls]
    # ONE CELL, NOT FIFTEEN, AND THE REASON IS IN THE REGISTER. Every mutation
    # declared for this environment turns on the ABSENCE OF `data/` rather than
    # on the interpreter, so a second cell would repeat the measurement rather
    # than extend it. If a mutation is ever added here that turns on the
    # interpreter version, this comment is wrong and the matrix has to come back.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mutate ci.yml's test job on one cell
        # THE PREDICTION THIS JOB EXISTS TO TEST, WRITTEN BEFORE THE RUN.
        # `gates.suite`'s mutation is D-058's cause one restored: a control that
        # asserts on the path `_sdu22_ae_source` RETURNS rather than on the
        # filename both outcomes name. Here `data/` is absent, the call raises
        # SystemExit, and the suite must go red -- `demonstrated`. On a machine
        # with `data/` fetched the same mutation passes and the harness reports
        # `INERT`, which is the correct answer there.
        #
        # A run in which both environments agree is the finding, in whichever
        # direction it goes.
        run: |
          python tools/gates.py --assert-environment test
          python tools/gates.py --mutate-environment test --artifacts artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-mutation-test
          path: artifacts/
          if-no-files-found: error

  packaging-gates:
    name: Reintroduce each historical breakage against a real sdist
    runs-on: ubuntu-latest
    needs: [controls]
    # WHAT THIS JOB IS, AND THE CAVEAT THAT COMES WITH IT.
    #
    # The packaging gates are not commands. `build`'s sdist step and the whole
    # `installed-suite` job are multi-step sequences, so this job REPRODUCES
    # them rather than invoking them -- and a reproduction is not the gate. The
    # two can drift and nothing would say so. That cost is recorded in
    # `.github/gates.toml` beside every gate it applies to, because the
    # alternative was covering the five historical breakages with nothing at all.
    #
    # WHAT IT MEASURES. Each of the five is reintroduced one at a time on a
    # clean export, a real sdist is built from it, and both environments are run
    # through their command sequences. The table below is the coverage record
    # `[[defect_coverage]]` publishes, and a disagreement between this run and
    # that table is a finding in one of them.
    #
    # Re-measured 2026-08-24 on a62f99a (Windows, CPython 3.13), which is where
    # `[[defect_coverage]]` gets its numbers -- and ubuntu under GitHub's
    # `bash -e` was unexecuted, exactly as it was for D-040 and D-050. This job
    # is what ends that.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test tooling
        run: |
          python -m pip install --quiet build
          python -m pip install --quiet -e ".[dev]"
      - name: Reintroduce each historical breakage against a real sdist
        # THE `| tee` HERE SWALLOWED A NON-ZERO EXIT AND IS GONE.
        #
        # GitHub's default shell for `run:` on Linux is `bash -e {0}`. `-e` is
        # set; `pipefail` is NOT. The exit status of `a | tee b` is tee's, so
        # this step reported success on 2026-08-25 while
        # `gate_packaging_mutation.py` was returning 1 -- every one of its six
        # sdist builds had failed, its own control was void, and it printed
        # `0 of 5` twice. The whole workflow was green.
        #
        # That is a check that could not fail in the environment where it ran,
        # introduced by the workflow built to catalogue exactly that shape, and
        # it is the fifth instance in this repository. The redirect below keeps
        # the artifact and keeps the exit code; `cat` puts the summary back in
        # the log where a reader expects it.
        #
        # `status=$?` on its own line would never run under `-e`: the shell
        # aborts on the failing command first. `|| status=$?` is the form that
        # survives errexit, and it is why this is four lines rather than one.
        run: |
          mkdir -p artifacts/packaging
          status=0
          python tools/gate_packaging_mutation.py --out artifacts/packaging \
            > artifacts/packaging/summary.txt || status=$?
          cat artifacts/packaging/summary.txt
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gate-mutation-packaging
          path: artifacts/
          if-no-files-found: error

  report:
    name: The register, and how much of it is demonstrated
    runs-on: ubuntu-latest
    needs:
      [
        controls,
        lint-gates,
        resource-gates,
        test-gates,
        zero-dependency-gates,
        import-time-gates,
        packaging-gates,
      ]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `--evidence-provenance` asks git what changed between the commit a
          # demonstration was taken on and HEAD. A depth-1 checkout cannot
          # answer that for any commit, so every row would read `unknown`.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Print the register
        # Printed on every run, whether the totals flatter or not. The line
        # that matters is the in-situ count: on the day this workflow was
        # written it was ZERO, and a register that only reports its good totals
        # is the document this repository keeps finding stale.
        run: python tools/gates.py --list

      - name: Which recorded evidence predates a change to the gate it describes
        # THE PROOF THAT LICENSED THE FIRST HARVEST HAD A ONE-COMMIT LIFETIME.
        # All thirteen demonstrations rested on one sentence in docs/GATES.md:
        # that `git diff <harvest commit> HEAD` over eight paths was EMPTY. It
        # was true when written and false on the next commit. This computes the
        # same question per gate instead, and prints it whether it flatters or
        # not. It needs history: `actions/checkout` fetches depth 1 by default,
        # so without the line below every row reads `unknown`, which is honest
        # and useless.
        run: python tools/gates.py --evidence-provenance

      - name: Print the cost ranking, worst first
        # WHICH GATE TO FIX, not how many are unfixed. A count told a reader
        # with one afternoon nothing; this orders every gate by what it costs
        # if it silently stops working, and marks the ones that have never been
        # demonstrated where they run.
        run: python tools/gates.py --ranking

      - name: How to record what this run demonstrated
        # THE HARVEST STEP, AND IT EXISTS BECAUSE THE FIRST RUN WAS NOT
        # HARVESTED. This workflow ran green on 2026-08-25, uploaded all five
        # artifact bundles, and `--check` went on printing `0 of 36` for a
        # phase afterwards because nobody wrote the run id into the register.
        # Evidence that is produced and not recorded is evidence nobody has.
        run: |
          echo "This run: ${{ github.run_id }} at commit ${{ github.sha }}"
          echo
          echo "For every gate this run reported \`demonstrated\`, add to its"
          echo "[gates.<id>.mutation] table in .github/gates.toml:"
          echo
          echo "  verified_in_situ_on = $(date -u +%Y-%m-%d)"
          echo "  verified_in_situ_run = \"${{ github.run_id }}\""
          echo "  verified_in_situ_commit = \"$(git rev-parse --short=7 HEAD)\""
          echo
          echo "Then append an InSituRound to IN_SITU_TRAJECTORY in tools/gates.py."
          echo "tools/gates.py --check refuses the register until you do, and it"
          echo "refuses a round that raises the in-situ debt."
