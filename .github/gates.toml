[gates.memo_identity]
environment = "lint"
step = "The governed memo changes no answer, provenance included"
command = "python tools/gate_memo_identity.py"
defect_class = "behaviour"
cost_rank = 8
blast_radius = "installed_behaviour"
silence = "silent"
redundancy = "sole"
cost_if_inert = """
Operating rule 19 in one gate. A memo that changes one `entry_id` in ten million is catastrophic
for a governance instrument and completely invisible to a benchmark, which reports a rate and
never looks at a field. Inert, an optimisation lands "benchmarked-equal" and the audit trail it
quietly rewrote is the product. `sole`: nothing else in this repository compares full provenance
between a cached and an uncached run.
"""
detects = """
Any difference in the full JSON rendering of a governed result between every memo level on and
every level forced off -- entry_id, source, confidence, class_word, beat, kind, is_known,
is_fully_known and unaccounted, not just the phrase everybody looks at. Two of the four levels are
keyed by CALLER INPUT rather than by the vocabulary, which is the shape where a collision between
two spellings is invisible in the phrase and fatal in the audit trail. It also refuses a run in
which the arms did not differ -- the memo-off arm remembering anything, or a level the all-on arm
never filled -- so it cannot go green on a library that had stopped caching.
"""
blind_to = """
THE CORPUS IT GETS ON A RUNNER IS SMALLER THAN THE ONE A DEVELOPER MACHINE GIVES IT, and that is
the honest statement of this gate's reach. `data/` is fetched and never committed, so `lint` runs
the generated fixture corpus and reports every real snapshot as absent; the 155,272-identifier
Socrata arm only runs where somebody has fetched it. A collision that needs real-world identifier
diversity to appear would not be seen here.

It is also blind to everything that is not a memo: a wrong answer both arms agree on is byte-
identical and passes. This gate says the cache changes nothing, never that the uncached answer is
right.
"""
[gates.memo_identity.mutation]
kind = "automated"
expect = "fail"
expect_failure_matching = "MEMO CHANGED AN ANSWER"
artifact = "lint/memo_identity.log"
verified_locally_on = 2026-09-08
verified_in_situ_on = 2026-09-09
verified_in_situ_run = "34308556192"
verified_in_situ_commit = "4ef57c8"
note = """
THE MUTATION BREAKS THE GATE'S OWN PREMISE RATHER THAN THE MEMO, and that is the stronger of the
two available probes.

`_NullMap.__setitem__` is what makes "forced off" a real code path: it discards every write, so
the hot path does one `get` and one `__setitem__` and cannot tell which map it holds. Make it
store, and the memo-off arm is no longer a memo-off arm -- every comparison becomes a run against
itself, every mismatch count is trivially zero, and a gate reporting `0 of 155,272` would be
reporting nothing at all. The occupancy guard is what refuses that, and this mutation is what
shows the guard fires where the gate runs.

The alternative probe -- corrupting a memo key so the cache really does serve a wrong entry_id --
edits `src/acronymkit/governed/dictionary.py`'s keying, which is under active change by another
workstream, and `--mutate` restores from bytes read beforehand. A restore that overwrites somebody
else's concurrent write is a worse failure than a weaker probe.

NO IN-SITU EVIDENCE YET: the run that takes it is the one that lands this commit.

HARVESTED 2026-09-09, AND THE ROUND THAT REGISTERED THIS GATE HAD ALREADY BEEN DEMONSTRATED WHEN
IT SAID SO. The registration round wrote "NO IN-SITU EVIDENCE, AND IT IS RANK 3 ... the run that
lands this work is the run that owes the demonstration". That run is 34308556192, it fired on the
push of 4ef57c8, and its job "Mutate the lint gates, in the lint environment" reports
`8 demonstrated, 0 INERT or UNRESTORED, 0 not automated` -- figures and memo_identity among them,
both `mutated rc=1, restored rc=0`, both under the `expect_failure_matching` rule. THIS IS D-106
HAPPENING AGAIN, ONE ROUND LATER AND TWO DAYS FASTER: the evidence was in the Actions tab and the
register was still printing the debt. The overall run is red on a different job
("Reintroduce each historical breakage against a real sdist"), which 017cb37 is the fix for; the
lint-environment job it is harvested from is green on its own.

STALENESS, STATED RATHER THAN LEFT TO --evidence-provenance: the stamp is at 4ef57c8 and HEAD is
017cb37, two commits later. Neither of those commits touches this gate's dependency set -- the diff
4ef57c8..017cb37 is MANIFEST.in, tests/test_governed_fast_construction.py and
tests/test_packaging_manifest.py -- so the gate demonstrated there is the gate shipping here. That
stops being true the moment this commit lands, because it moves .github/gates.toml.
"""
edits = [
  { file = "src/acronymkit/governed/dictionary.py", find = "        \"\"\"Discard the answer, so nothing is ever remembered.\"\"\"", replace = "        dict.__setitem__(self, key, value)" },
]

[gates.run_summary]
environment = "lint"
step = "Every round files a machine-readable account of itself, and an absence is a verdict"
command = "python tools/run_summary.py --check"
defect_class = "claim_backing"
cost_rank = 37
blast_radius = "evidence_apparatus"
silence = "silent"
redundancy = "sole"
cost_if_inert = """
RANKED LAST IN ITS BUCKET ON PURPOSE, and the argument is against this gate rather than for it.
Every other evidence_apparatus gate protects a demonstration that some OTHER check can fail. This
one protects a narrative record, which is one step further from any user than any of them, and it
would be an easy gate to rank flatteringly because its own workstream wrote its rank. Inert, a
round's self-assessment can be malformed, mislabelled, missing eleven of its twelve sampling
claims, or written to a schema that has drifted from the one CONTRIBUTING.md publishes, and every
one of those reads as a filed report. Nothing downstream re-derives a summary.
"""
detects = """
A committed run summary that is not one: a missing field, an unknown key (a
misspelt field is a dropped field), a `status` outside {complete, partial}, a
`gates` object that does not report all eight commands, a
`claims_for_sampling` that is not exactly twelve, a `label` that disagrees with
its own filename, a dotted `run_ids` entry that resolves to no run in
bench/results.json, a round directory with no roster, and a field list in
CONTRIBUTING.md that has drifted from tools/run_summary.py.
"""
blind_to = """
THREE THINGS, AND THE FIRST IS THE WHOLE POINT OF THE MECHANISM'S LIMIT.

1. A REPORT THAT NEVER HAPPENED. This makes a lost report recoverable; it does
   not make one happen. An agent that dies before its penultimate tool call
   files nothing, and neither this gate nor anything else here can tell that
   from an agent that was never launched. The roster narrows it to "who was
   expected" and narrowing is not closing. Closing it needs the LAUNCHER to
   write a start record when it spawns an agent; that is outside this
   repository.

2. TRUTH. Every rule here is about shape. A summary whose twelve sampling
   claims are all false validates perfectly, and the measured not-true rate on
   this class of output is 18.75 %.

3. NUMBERS INSIDE A SUMMARY. `.github/run-summaries/` is in none of
   tools/check_claims.py's seven SCAN_GLOBS, so a sentence reading "F1 rose to
   99.9 %" inside a committed summary is an unbacked claim that reddens
   nothing. Same shape as the figure hole R16 was written for, one channel
   further out. Named, priced, not closed here: SCAN_GLOBS carries two ratchets
   this gate's workstream does not own.

And `absent` and `vacuous` are DELIBERATELY not failures. A round in which an
agent died must stay committable exactly as it happened; if absence reddened
the build, the cheapest route to green would be deleting the roster entry,
which is the gate becoming a machine for hiding what it exists to reveal. Both
states are printed on every run.
"""
[gates.run_summary.mutation]
kind = "automated"
expect = "fail"
expect_failure_matching = "run-summary register refused"
artifact = "lint/run-summary.log"
verified_locally_on = 2026-09-09
verified_in_situ_on = 2026-09-09
verified_in_situ_run = "34352662794"
verified_in_situ_commit = "fbf7c45"
note = """
The probe puts an unreadable `status` on the one committed summary. It is the
narrowest edit that reaches the schema half of this gate without touching the
roster half, and the marker it matches is `tools/run_summary.py`'s
FAILURE_MARKER -- pinned against the source by
tests/test_run_summary.py::TestTheRegisterAndTheScriptAgree so the two copies
cannot drift in silence, which is what turns a future demonstration INERT.

NO IN-SITU EVIDENCE YET, and the honest reason is that the workstream that
wrote this gate cannot push. The commit that adds a gate cannot hold the CI run
that demonstrates it; gate-mutation.yml triggers on .github/gates.toml,
.github/workflows/*.yml and tools/gates.py, all three of which this commit
touches, so the run that lands this work is the run that owes the
demonstration. Locally it returns DEMONSTRATED (mutated rc=1 matching the
marker, restored rc=0) -- which is precisely the evidence R11 says does not
count.
"""
edits = [
  { file = ".github/run-summaries/mandate-iii-phase-c/run-summary.json", find = "\"status\": \"complete\"", replace = "\"status\": \"shipped\"" },
]

[gates.agent_summary]
environment = "lint"
step = "A workstream that exited cleanly filed an account of itself"
command = "python tools/run_summary.py --check-agent-summary"
defect_class = "claim_backing"
cost_rank = 39
blast_radius = "evidence_apparatus"
silence = "silent"
redundancy = "partial"
cost_if_inert = """
RANKED BELOW gates.run_summary AND gates.second_reader, AND THE ARGUMENT IS AGAINST THIS GATE.
run_summary protects the SHAPE of a narrative record; this one protects the FACT that a record
exists, which is one further step from any user, and its live input for every real round in the
register today is missing. Inert, an agent that ran to completion and filed nothing reads exactly
like an agent that was killed, which is the state the register was already in before this gate --
so the cost of it going inert is a return to the status quo ante rather than a new defect. That is
a weaker cost-if-inert than any gate above it and the rank says so. The workstream that wrote this
gate wrote this rank, and the rank is placed at the bottom of the evidence_apparatus bucket for
exactly that reason; a reader who thinks a gate over agent accountability belongs above a linter is
making an argument this ranking rejects with a reason rather than by omission.
"""
detects = """
A workstream on a round's roster whose `exits.toml` records exit status 0 and
whose summary is absent, invalid or unreadable. Also: an exit record that is
malformed, that carries an unknown key, that records a non-integer status, that
names a label the roster does not, or that declares itself complete while
omitting a rostered workstream; a roster that declares roster_complete = true
and files no exit record at all; a control directory whose reader verdicts have
drifted from the states its [control] table declares; and a register holding no
control that asserts both `absent` and `unreadable`.
"""
blind_to = """
FOUR THINGS, AND THE FIRST IS THE ONE THAT DECIDES HOW MUCH THIS GATE IS WORTH
TODAY.

1. EVERY REAL ROUND. `exits.toml` is written by whatever SPAWNS the agents, and
   as of this commit no such program writes one. Both real rounds in the
   register are therefore UNATTRIBUTED and this gate concludes nothing about
   either. It prints that count on every run rather than passing in silence,
   and the gate is demonstrated against a committed control fixture --
   which establishes that the code can fail, NOT that any round anybody ran was
   ever checked. Those are different sentences and only the first is evidenced.

2. A ROSTER THAT DECLARES ITSELF INCOMPLETE. The rule "a complete roster must
   carry an exit record" is escapable by writing `roster_complete = false`,
   which is what both real rounds do. That escape is deliberate -- a workstream
   genuinely cannot enumerate its siblings -- and it means a launcher that
   never wants to be accountable never has to be.

3. A VACUOUS SUMMARY. `--template` output filed unchanged satisfies this gate.
   Refusing it would make the cheapest route to green a paragraph of filler,
   which is the opposite of what the mechanism is for.

4. TRUTH, exactly as for gates.run_summary. The exit record is a self-report by
   the launcher and nothing here audits it; a launcher that writes `0` for a
   process it never waited on gets a green build and a false accusation
   whenever the summary is missing.
"""
[gates.agent_summary.mutation]
kind = "automated"
expect = "fail"
expect_failure_matching = "agent-summary register refused"
artifact = "lint/agent-summary.log"
verified_locally_on = 2026-09-09
verified_in_situ_on = 2026-09-09
verified_in_situ_run = "34408932625"
verified_in_situ_commit = "5a268cd"
note = """
The probe flips ONE exit status in the control fixture: `killed-before-filing`
goes from 137 to 0, so a workstream that filed nothing is reported as having
exited successfully. That is the narrowest edit that reaches THIS gate's own
rule rather than any rule it shares with gates.run_summary -- the summary is
still absent, the control's declared state is still `absent`, and the only
thing that moved is whether the absence is somebody's bad luck. It is also why
the mutation target is the exits file and not a summary file: deleting a
summary would fire the control-expectation rule as well, and a demonstration
that fires two rules at once does not say which one it demonstrated.

The marker it matches is `tools/run_summary.py`'s AGENT_SUMMARY_MARKER, pinned
against this register by tests/test_run_summary.py so the two copies cannot
drift in silence -- which is what turns a future demonstration INERT.

PAID IN THE SAME SESSION. The waiver named when it would be paid rather than
deferring it: gate-mutation.yml triggers on .github/gates.toml,
.github/workflows/*.yml and tools/gates.py, and the commit that created this
gate touched all three, so the push that landed it fired the workflow. Run
34408932625 at commit 5a268cd, job 'Mutate the lint gates, in the lint
environment', artifact lint/agent-summary.log:

  verdict:   demonstrated
  mutated:   rc=1
  restored:  rc=0
  captured:  2026-09-09T21:49:16+00:00
  platform:  linux python 3.12.14

The captured output is the gate naming the mutated label -- 'killed-before-filing:
exited 0 and its summary is ABSENT' -- and printing the other three states beside
it, so the log shows WHICH rule fired rather than only that something did.
"""
edits = [
  { file = ".github/run-summaries/_control-agent-crash/exits.toml", find = "killed-before-filing = 137", replace = "killed-before-filing = 0" },
]

