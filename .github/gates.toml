# The gate register: every check that can fail CI, and the evidence that it can.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# Four defects shipped in one round and every one was the same shape: a check
# that could not fail in the environment where it ran (D-058).
#
#   * the claims gate could not fail in a checkout holding every file it scans;
#   * the suite could not fail on a machine holding `data/` and `tools/`;
#   * mypy could not fail against a `click` predating `match`;
#   * `tests/test_splits_manifest.py` had NEVER ONCE RUN in the extracted tree,
#     hiding a whole module behind a green `build` job.
#
# None of the four was found by a gate. All four were found by the one
# environment that differed, which was CI. That is R11:
#
#     A gate must be DEMONSTRATED CAPABLE OF FAILING in the environment where it
#     runs. Not locally. Not in principle. In situ, by mutation, with the
#     failure captured.
#
# This file is where that demonstration is recorded, per gate, with a date.
#
# ---------------------------------------------------------------------------
# HOW TO READ IT, AND WHAT READS IT
# ---------------------------------------------------------------------------
# `tools/gates.py` parses this file into typed objects and validates it; the
# `lint` job runs `python tools/gates.py --check`; `tests/test_gate_manifest.py`
# drives the same validator and mutation-tests it.
# `.github/workflows/gate-mutation.yml` runs the declared mutations on a
# schedule and uploads the captured failures.
#
# The rule that keeps this file honest is not any rule about its own contents.
# It is that **every job in every workflow must appear here** -- with gates, or
# with a `no_gates_reason` -- so a job added tomorrow reddens `--check` until
# somebody says what it checks. Without that, this is a paragraph that was true
# once, which is the state `bench/splits.toml` was in for months while eleven
# places cited it and nothing parsed it.
#
# `holds` and `lacks` are repo-relative path GLOBS, not prose, because
# `tools/gates.py --assert-environment <env>` checks them. An environment
# description nothing checks is the premise every gate silently rests on, and
# D-058 is three defects that came from exactly that premise being wrong.
#
# ---------------------------------------------------------------------------
# WHAT `mutation.kind` MEANS, AND WHY MOST OF THEM ARE REFUSALS
# ---------------------------------------------------------------------------
#   automated  an edit declared below. `tools/gates.py --mutate <gate>` applies
#              it, runs the gate's OWN command, requires a non-zero exit, puts
#              the tree back, and requires a zero exit again. Both halves are
#              needed: without the restore, a gate failing for an unrelated
#              reason reads as a successful demonstration.
#   inline     the gate's implementation is a heredoc inside a workflow file.
#              There is no command to invoke, so a harness could only run a
#              COPY of it -- and D-018 settled that a copy may not stand in for
#              the thing. The fix is to extract the heredoc into a script the
#              way `tools/splits.py` was extracted; that is named, costed and
#              not done.
#   control    the step IS a positive control: it exists to prove its
#              neighbours can fail.
#   manual     mutable, but only in an environment this harness cannot create
#              (a release, a privileged network namespace).
#   none       no mutation proposed, and the reason says why.
#
# R14: a refusal ships with a disposition. Every non-automated entry carries a
# `reason`, and `--check` prints the counts whether they flatter or not.
#
# ---------------------------------------------------------------------------
# WHAT `cost_rank` MEANS, AND WHY IT IS A FIELD RATHER THAN A PARAGRAPH
# ---------------------------------------------------------------------------
# `--check` printed `CARRYING IN-SITU EVIDENCE: 0 of 36` on every CI run for a
# phase. The line was honest and it was useless: it told a reader with one
# afternoon nothing about WHICH gate to fix. So every gate now carries a total
# order, and the order is derived rather than asserted:
#
#   blast_radius  how far the damage travels if this gate silently stops
#                 working, worst first: published_numbers, installed_behaviour,
#                 release_provenance, distribution_contents, evidence_apparatus,
#                 repository.
#   silence       how the failure announces itself TO THIS PROJECT if the gate
#                 is inert: silent, delayed, loud. This is the D-058 axis -- all
#                 four defects of that record were silent here and loud on a
#                 runner -- and it is why a silent gate outranks a loud one at
#                 the same blast radius.
#   redundancy    whether another registered gate covers the same defect: sole,
#                 partial, covered. DECLARED AND PRINTED, AND DELIBERATELY NOT
#                 PART OF THE ORDER. As a third lexicographic key it ranked a
#                 resource-consistency check above the whole test suite, purely
#                 because the suite is partly duplicated by installed-suite. A
#                 factor that decides ranks nobody would defend is worse than
#                 one that informs them.
#
# `tools/gates.py --check` refuses a `cost_rank` that is not a permutation of
# 1..36, and refuses one that inverts (blast_radius, silence). Ties on that key
# are left free: inside one bucket the order is judgement, and `cost_if_inert`
# is where the judgement is written down and can be argued with.
#
# THE MOST ATTACKABLE JUDGEMENT IN THE ORDERING, NAMED RATHER THAN BURIED:
# every positive control is `evidence_apparatus` and therefore ranks in the
# twenties, below gates whose defects reach a user. The argument is that a
# rotted control is NECESSARY BUT NOT SUFFICIENT for the protected defect to
# ship. A reader who holds that a control which has stopped controlling costs
# exactly what the gate behind it costs is making an argument this ranking
# rejects with a reason rather than by omission.
#
# ---------------------------------------------------------------------------
# THE STATE, AND HOW IT CHANGED
# ---------------------------------------------------------------------------
# WRITTEN AT ZERO. Every mutation below was first run on a developer machine,
# which is precisely the evidence R11 says does not count, and `--check` printed
# `0 of 36` on every CI run so it could not be quietly read past.
#
# IT IS NOW 13 OF 36, AND THE EVIDENCE WAS NOT NEW WORK. `gate-mutation.yml`
# HAD run -- once, on 2026-08-25, green, with all five artifact bundles
# uploaded -- and nothing in this repository had ever looked at it. All 13
# automated gates came back `demonstrated` on ubuntu-latest under CPython
# 3.12. Each one now carries the date, the run id AND the commit, because a run
# id says a demonstration happened and only the commit says which gate was
# demonstrated.
#
# The 23 that remain are the 8 inline, 13 manual and 2 control refusals. None of
# them is a gate this harness can mutate, so the next payment is not more of the
# same: it is the heredoc extraction that would close three of the eight at
# once. `IN_SITU_TRAJECTORY` in `tools/gates.py` is the ledger, and its quota is
# a CEILING ON THE DEBT rather than a floor on the coverage count -- because a
# floor is satisfied by a round that adds five gates and demonstrates none,
# while `13 of 36` quietly becomes `13 of 41`.

[manifest]
schema_version = 1

# WHERE THE REGRESS STOPS, AND WHY THERE.
#
# A manifest of mutation artifacts is itself a check, and it will rot the same
# way everything else here rotted -- by passing where it cannot fail. So it has
# its own mutation one level up: `gates.gate_manifest` below appends an
# unregistered job to `ci.yml` and requires `--check` to refuse it, and
# `tests/test_gate_manifest.py` mutation-tests the validator the way
# `tests/test_splits_manifest.py` mutation-tests the splits validator.
#
# One level up from THAT, the regress stops by judgement, and here is the
# judgement. `gate-mutation.yml` runs its own two synthetic controls on every
# scheduled run: `control.always_red` must be demonstrated and
# `control.always_green` must come back INERT. If the harness has rotted into a
# no-op, the second control does not come back INERT and the job goes red. That
# failure is visible to a human reading a red CI run in the Actions tab, and
# THAT is where this stops -- at the first level where the alarm reaches a
# person rather than another check.
#
# What that leaves open, said rather than implied: a scheduled workflow that
# stops running entirely raises nothing. GitHub disables `schedule` triggers
# after 60 days of repository inactivity, and no check in this repository would
# notice. `--check` prints the age of the newest in-situ verification as a NOTE
# on every CI run, which is a nudge and not a gate, for the reason
# `tools/splits.py` gives about its own staleness window: a gate that turns red
# with the passage of time fires on an unrelated commit. The regress is not
# closed. It is stopped, deliberately, one step above the last automated check.
stops_at = """
At the two synthetic controls inside .github/workflows/gate-mutation.yml. A
harness that has rotted into a no-op fails `control.always_green`, which reddens
the scheduled run, which a human sees in the Actions tab. A scheduled workflow
that stops running at all is NOT detected by anything here; --check reports the
age of the newest in-situ verification as a note, and a note is not a gate.
"""


# ===========================================================================
# ENVIRONMENTS
# ===========================================================================
# Each one is a place a gate runs, described by what it HOLDS and what it LACKS
# -- as globs, so `tools/gates.py --assert-environment <name>` can check them.

[environments.lint]
workflow = "ci.yml"
job = "lint"
runs_on = "ubuntu-latest"
holds = ["src/acronymkit/__init__.py", "tools/*.py", "bench/splits.toml", "bench/results.json"]
lacks = ["data/MED1250_labeled", "data/plod_cw_dev.conll"]
note = """
A checkout with the dev extra installed. Every scan target of every gate here
is present by construction, which is the property that made the claims gate
unable to fail in this environment while failing in the sdist (D-058, fourth
instance). The `lacks` entries are the fetched corpora: a runner never has
them, a developer machine usually does, and that difference is cause one of the
same record.
"""

[environments.resources]
workflow = "ci.yml"
job = "resources"
runs_on = "ubuntu-latest"
holds = ["src/acronymkit/resources/lexicon_en.txt", "schemas/*.json", "tools/validate_resources.py"]
lacks = ["data/scowl-2020.12.07.tar.gz"]
note = """
The base package installed, no dev extra. Resources are checked against their
sources, which are not fetched here -- so this job checks committed artifacts
against each other and never against upstream.
"""

[environments.test]
workflow = "ci.yml"
job = "test"
runs_on = "ubuntu-latest, windows-latest, macos-latest x 3.9-3.13"
holds = ["tests/conftest.py", "bench/corpora.py", "bench/splits.toml", "tools/splits.py"]
lacks = ["data/MED1250_labeled", "data/sdu22_ae_legal_dev.json", "data/plod_cw_dev.conll"]
note = """
Fifteen matrix cells. The load-bearing property is the `lacks` list: `data/` is
fetched and never committed, so every cell of this job is already a
suite-with-the-corpora-absent run. That is why D-058's cause one -- three
controls asserting on a resolved corpus path -- was green on the author's
machine and red on every runner.
"""

[environments.zero_dependency]
workflow = "ci.yml"
job = "zero-dependency"
runs_on = "ubuntu-latest"
holds = ["src/acronymkit/__init__.py"]
lacks = []
note = "Base package only. No click, spaCy, NLTK or onnxruntime is installed."

[environments.air_gap]
workflow = "ci.yml"
job = "air-gap"
runs_on = "ubuntu-latest"
holds = ["tests/airgap_socket_guard.py"]
lacks = []
note = """
A privileged runner: `sudo unshare -n` builds a network namespace with no
route. THIS IS THE ONE JOB IN THE REPOSITORY THAT ALREADY SATISFIED R11 BEFORE
R11 WAS WRITTEN. It opens with a positive control proving the namespace really
has no route, and carries a second proving the socket guard really blocks --
because, in its own words, a renamed patch target yields a green suite that
checks nothing, which is worse than no gate because it reads as evidence. The
pattern existed here for months and was never generalised to any other job.
"""

[environments.import_time]
workflow = "ci.yml"
job = "import-time"
runs_on = "ubuntu-latest"
holds = ["src/acronymkit/__init__.py"]
lacks = []
note = """
A non-editable install of the base package. Not editable on purpose: an
editable install adds a path finder of its own and what is measured is what a
user installs.
"""

[environments.installed_suite]
workflow = "ci.yml"
job = "installed-suite"
runs_on = "ubuntu-latest"
holds = ["tests/conftest.py", "pyproject.toml"]
lacks = []
note = """
The run directory holds `tests/` and `pyproject.toml` FROM THE ARTIFACT and
nothing else: no `src/`, no `bench/`, no `tools/`, no `data/`, no `MANIFEST.in`.
The `holds`/`lacks` globs above are checked against the CHECKOUT, not against
that run directory, so they say almost nothing about this environment -- which
is itself worth writing down, and is the reason
`gates.installed_suite.expected_non_passing` is not automated below.
"""

[environments.build]
workflow = "ci.yml"
job = "build"
runs_on = "ubuntu-latest"
holds = ["MANIFEST.in", "pyproject.toml", "bench/results.json", "bench/splits.toml", "data/LICENSES.md"]
lacks = []
note = """
A checkout that builds an sdist and a wheel, then extracts the sdist and runs
the suite inside it. The extracted tree is the environment that catches the
most historical breakages -- four of five, measured, see [[defect_coverage]] --
because it EXECUTES the import rather than matching a pattern.
"""

[environments.codeql]
workflow = "codeql.yml"
job = "analyze"
runs_on = "ubuntu-latest"
no_gates_reason = """
A third-party analysis whose findings this repository does not define and whose
failure modes it cannot mutate: the rule set is GitHub's, it changes without a
commit here, and a synthetic vulnerability planted to prove it fires would be
committed source claiming to be a probe. Declared so the job is not invisible;
not gated, and this is the disposition rather than an omission.
"""

[environments.scorecard]
workflow = "scorecard.yml"
job = "analysis"
runs_on = "ubuntu-latest"
no_gates_reason = """
OSSF Scorecard publishes a score; it does not fail this repository's builds on
a threshold. Nothing here can go red, so there is no gate to demonstrate.
"""

[environments.publish_build]
workflow = "publish.yml"
job = "build"
runs_on = "ubuntu-latest"
note = """
Runs only on a release or an explicit dispatch. Its gates are real and its
mutations are `manual` for one reason: producing the environment means cutting
a release, and a scheduled harness that cut releases to test itself would be a
worse failure than the one it prevents.
"""

[environments.publish_testpypi]
workflow = "publish.yml"
job = "publish-testpypi"
runs_on = "ubuntu-latest"
no_gates_reason = """
An upload step. Its only failure mode is the index rejecting the artifact,
which is not a property of this tree and cannot be mutated without uploading a
deliberately broken distribution to a public index.
"""

[environments.publish_pypi]
workflow = "publish.yml"
job = "publish-pypi"
runs_on = "ubuntu-latest"
no_gates_reason = "Same as publish-testpypi: an upload, against the real index."

[environments.publish_attest]
workflow = "publish.yml"
job = "attest"
runs_on = "ubuntu-latest"
no_gates_reason = """
Generates build provenance through a GitHub-provided action. The attestation is
produced by the platform, not by this tree; there is nothing here to mutate.
"""

[environments.publish_release_assets]
workflow = "publish.yml"
job = "release-assets"
runs_on = "ubuntu-latest"
no_gates_reason = "Uploads files to the release page. It asserts nothing about the tree."

[environments.mutation_harness]
workflow = "gate-mutation.yml"
job = "lint-gates"
runs_on = "ubuntu-latest"
holds = [".github/gates.toml", "tools/gates.py"]
lacks = ["data/MED1250_labeled"]
note = """
The harness's own environment. It mirrors `ci.yml`'s `lint` job so the
mutations it runs there are run where those gates run.
"""

[environments.mutation_controls]
workflow = "gate-mutation.yml"
job = "controls"
runs_on = "ubuntu-latest"
holds = [".github/gates.toml"]
lacks = []
note = """
Two synthetic gates and nothing else. This is where the regress stops: see
[manifest].stops_at.
"""

[environments.mutation_test]
workflow = "gate-mutation.yml"
job = "test-gates"
runs_on = "ubuntu-latest"
holds = ["tests/conftest.py"]
lacks = ["data/MED1250_labeled"]
note = """
Mirrors `ci.yml`'s `test` job on one cell rather than fifteen. One cell is
enough for the mutations declared here, all of which turn on the absence of
`data/` rather than on the interpreter version.
"""

[environments.mutation_resources]
workflow = "gate-mutation.yml"
job = "resource-gates"
runs_on = "ubuntu-latest"
no_gates_reason = """
A mutation runner for `environments.resources`, whose gates are registered
there. It carries no gate of its own: its correctness is held by the `controls`
job, and giving it one would be a second register entry for the same two
mutations.
"""

[environments.mutation_report]
workflow = "gate-mutation.yml"
job = "report"
runs_on = "ubuntu-latest"
no_gates_reason = """
Prints `tools/gates.py --list` after every other job has run, so the in-situ
count sits at the bottom of the run whatever the jobs above did. It asserts
nothing, so there is nothing to demonstrate. It exists because a count nobody
prints is a count nobody reads.
"""

[environments.mutation_packaging]
workflow = "gate-mutation.yml"
job = "packaging-gates"
runs_on = "ubuntu-latest"
holds = ["MANIFEST.in"]
lacks = []
note = """
Mirrors `ci.yml`'s `build` job far enough to reintroduce the five historical
breakages against a real sdist. The gate commands here run inside the extracted
tree, so this job is the only place the packaging mutations mean anything.
"""


# ===========================================================================
# GATES -- ci.yml : lint
# ===========================================================================

[gates.ruff]
environment = "lint"
step = "Ruff"
command = "python -m ruff check src tests tools bench"
defect_class = "static_analysis"
cost_rank = 35
blast_radius = "repository"
silence = "loud"
redundancy = "sole"
cost_if_inert = """
Inert, lint violations accumulate across src, tests, tools and bench. Nothing ships wrong; the
next person to run anything sees them. `bench` was outside this check for months and the cost of
that was style, not correctness.
"""
detects = """
Lint violations across src, tests, tools and bench. `bench` was outside the
check for months while holding every benchmark runner -- the only writers of
bench/results.json, the file every published claim is verified against.
"""
[gates.ruff.mutation]
kind = "automated"
expect = "fail"
artifact = "lint/ruff.log"
verified_locally_on = 2026-08-24
verified_in_situ_on = 2026-08-25
verified_in_situ_run = "32808357572"
verified_in_situ_commit = "3173126"
note = """
An unused import is the cheapest thing ruff must catch. The probe is a NEW file
rather than an edit to an existing one, so a botched restore leaves an
unreferenced file rather than a corrupted tool.
"""
edits = [
  { file = "tools/_gate_probe_ruff.py", create = "import os\n" },
]

[gates.ruff_format]
environment = "lint"
step = "Ruff format check"
command = "python -m ruff format --check src tests tools bench"
defect_class = "static_analysis"
cost_rank = 36
blast_radius = "repository"
silence = "loud"
redundancy = "sole"
cost_if_inert = """
The cheapest gate here if it stops working, and it is ranked last for that reason rather than
because it is easy to mutate. Inert, formatting drifts. It is a formatter, not a style review,
and it has never been the thing that caught a bad change.
"""
detects = "Formatting drift in src, tests, tools and bench."
blind_to = """
Everything ruff's formatter does not normalise. It is a formatter, not a style
review, and this gate has never been the thing that catches a bad change.
"""
[gates.ruff_format.mutation]
kind = "automated"
expect = "fail"
artifact = "lint/ruff-format.log"
verified_locally_on = 2026-08-24
verified_in_situ_on = 2026-08-25
verified_in_situ_run = "32808357572"
verified_in_situ_commit = "3173126"
note = """
Single quotes are a formatting-only difference: the selected lint rules say
nothing about quote style, so this probe separates the format gate from the
lint gate rather than tripping both.
"""
edits = [
  { file = "tools/_gate_probe_format.py", create = "X = 'a'\n" },
]

[gates.mypy]
environment = "lint"
step = "Mypy"
command = "python -m mypy"
defect_class = "static_analysis"
cost_rank = 10
blast_radius = "installed_behaviour"
silence = "delayed"
redundancy = "partial"
cost_if_inert = """
Inert at the wrong floor, a 3.10-only call ships and raises for a 3.9 caller -- which is the
recorded instance, not a hypothetical. Delayed rather than silent because the 3.9 matrix cells
did eventually catch it; they caught it after review, not before.
"""
detects = """
Type errors in src/acronymkit, tools and bench, checked at the 3.9 floor that
`requires-python` declares. The floor is the load-bearing half: five
`Path.write_text(newline=...)` calls -- 3.10+ only -- passed ruff, passed mypy
at a 3.10 setting, passed the suite on 3.13, and failed only on the 3.9 cells
of the matrix (D-058, cause two).
"""
blind_to = """
`click` is `follow_imports = "skip"`, so calls into it are unchecked. At the
3.9 floor mypy follows imports into third-party SOURCE, and current click uses
`match` -- a hard stop that kills the whole run on a dependency's syntax. That
did not reproduce locally because the resolved click there was 8.1.8.
"""
[gates.mypy.mutation]
kind = "automated"
expect = "fail"
artifact = "lint/mypy.log"
verified_locally_on = 2026-08-24
verified_in_situ_on = 2026-08-25
verified_in_situ_run = "32808357572"
verified_in_situ_commit = "3173126"
note = """
THIS IS THE DEFECT THAT SHIPPED, NOT A SYNTHETIC ONE. `Path.write_text` grew
its `newline` parameter in 3.10. The probe fails only while
`python_version = "3.9"` is really in force, so it demonstrates the gate AND
the setting the gate depends on -- which is the part that had silently changed.
"""
edits = [
  { file = "tools/_gate_probe_mypy.py", create = "from pathlib import Path\n\n\ndef probe(path: Path) -> None:\n    path.write_text(\"x\", newline=\"\\n\")\n" },
]

[gates.splits_manifest]
environment = "lint"
step = "The train/test manifest parses, and every corpus cites its licence"
command = "python tools/splits.py --check"
defect_class = "claim_backing"
cost_rank = 2
blast_radius = "published_numbers"
silence = "silent"
redundancy = "sole"
cost_if_inert = """
Backs the DECLARATIONS every headline number stands on: role, task, licence, contamination, read
date. Inert, a contaminated corpus can claim `held_out` and the number that comes out of it is
published as held out. The figure looks identical either way; only this gate can tell.
"""
detects = """
An invalid, incomplete or dishonest `bench/splits.toml`: a missing role, task
or licence; a licence cited from a badge rather than from terms; a future read
date; a ceiling with no basis; a contaminated corpus claiming the headline
role; a malformed reservation.
"""
[gates.splits_manifest.mutation]
kind = "automated"
expect = "fail"
artifact = "lint/splits.log"
verified_locally_on = 2026-08-24
verified_in_situ_on = 2026-08-25
verified_in_situ_run = "32808357572"
verified_in_situ_commit = "3173126"
note = """
Operating rule 4 in one edit: a badge URL in place of licence terms. This
project has recorded a corpus as more permissive than it is three times, and
every correction came from a person opening the actual terms.
"""
edits = [
  { file = "bench/splits.toml", find = "https://raw.githubusercontent.com/ncbi-nlp/Ab3P/41130cddfcba1449ba612905d4a51274f8f565a8/README.md", replace = "https://img.shields.io/badge/license-public--domain-green.svg" },
]

[gates.claims]
environment = "lint"
step = "Every performance claim is backed by a measurement"
command = "python tools/check_claims.py"
defect_class = "claim_backing"
cost_rank = 1
blast_radius = "published_numbers"
silence = "silent"
redundancy = "sole"
cost_if_inert = """
Every published number in this repository is adjudicated here and nowhere else. Inert, an
invented figure reads exactly like a measured one, ships in the sdist, and is quoted onward --
and a governance instrument's numbers ARE its product. Nothing downstream re-derives them.
"""
detects = """
A published number with no measurement behind it, plus two ratchets that may
not grow: value-matched claims and the deferred ledger.
"""
blind_to = """
Numbers no arming rule reaches -- 1,475 of them on the current tree, which the
tool prints on every run. And, structurally, the shape D-058 named: in a
CHECKOUT every scan target is present by construction, so the absent-target
branch of this gate cannot fire here. It fired in the sdist, and only there.
See gates.claims_in_sdist.
"""
[gates.claims.mutation]
kind = "automated"
expect = "fail"
artifact = "lint/claims.log"
verified_locally_on = 2026-08-24
verified_in_situ_on = 2026-08-25
verified_in_situ_run = "32808357572"
verified_in_situ_commit = "3173126"
note = """
The probe appends an uncited figure to docs/GATES.md, which is inside
`SCAN_GLOBS` and absent from both baselines -- so it is allowed zero and the
gate fails hard rather than adding to a ledger.
"""
edits = [
  { file = "docs/GATES.md", append = "\n<!-- gate mutation probe, reverted by tools/gates.py -->\nProbe: F1 of 99.97 % on nothing at all.\n" },
]

[gates.gate_manifest]
environment = "lint"
step = "Every CI gate is registered, and says whether it has ever failed on purpose"
command = "python tools/gates.py --check"
defect_class = "environment_drift"
cost_rank = 25
blast_radius = "evidence_apparatus"
silence = "silent"
redundancy = "sole"
cost_if_inert = """
