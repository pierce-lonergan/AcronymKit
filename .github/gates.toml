verified_in_situ_on = 2026-09-07
verified_in_situ_run = "34099756605"
verified_in_situ_commit = "34925f8"
note = """
THE WITHDRAWN EVIDENCE WAS RE-TAKEN UNDER THE MARKER RULE, AND THE RE-TAKE IS
WHAT MAKES THE VERDICT MEAN ANYTHING.

This gate's evidence was withdrawn on 2026-08-25 for a measured reason, not a
doubt: the harness decided `demonstrated` from a return code, and the probe
edits tests/test_splits_manifest.py, which is the anchor this very entry names,
so the register's own validator reddens the suite on its own. `rc != 0` was
reachable with the D-058 defect UNCAUGHT, in both environments, for any tree.
The verdict could not have come back INERT and carried no information at all.

`expect_failure_matching` above is the rule that replaced it: a non-zero exit
counts as a demonstration only when the gate's output contains the name of the
test that must fail. tools/gates.py applies it before the UNRESTORED check and
prints "the gate exited 1, but its output does not contain ..." when it does
not hold.

THE RE-TAKE. `gate-mutation.yml` run 34099756605, 2026-09-07, ubuntu-latest,
CPython 3.12, at commit 34925f8 -- the commit that SHIPPED the marker rule, so
the DEMONSTRATED below could only have been reached through it:

    environments.test: holds 4 declared path(s), lacks 3 -- this is that environment
    suite                     DEMONSTRATED  mutated rc=1, restored rc=0
    test_environment_control  DEMONSTRATED  mutated rc=1, restored rc=0

REPLICATED. Run 33379084166, 2026-08-31, same commit, a different weekly runner
image: identical verdict. Two runs a week apart on one tree is the only guard
this register has against a verdict that is a property of the image rather than
of the code, and it is the first time it has been exercised for this gate.

WHY THIS IS NOT THE PREVIOUS RECORD AGAIN. The withdrawn record was a FAILED
line transcribed into docs/GATES.md by a person, which is an unchecked claim in
exactly the way R16 says a figure inside an image is. This one is a verdict the
harness could only print by finding the named line in the gate's own output. The
evidence moved from prose into the mechanism.

WHAT IS STILL NOT DONE: the confound itself. The probe still edits a file the
register anchors on, so `rc=1` remains over-determined -- the marker makes the
verdict attributable without removing the second cause. Removing it needs a
probe that does not touch tests/test_splits_manifest.py, and the D-058 defect
lives in that file.
"""
edits = [
  { file = "tests/test_splits_manifest.py", find = "assert _unreserved_filename(\n            lambda: corpora._sdu22_ae_source(None, \"legal\", \"dev\")\n        ).endswith(\"legal_dev.json\")", replace = "assert corpora._sdu22_ae_source(None, \"legal\", \"dev\").name.endswith(\"legal_dev.json\")" },
]

