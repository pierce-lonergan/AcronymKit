# ===========================================================================
# DEFECT COVERAGE -- how many known defects each gate actually catches
# ===========================================================================
# The shape of record every gate should carry, and the reason this table is
# here rather than a sentence: D-050 retired an AST guard on the premise that
# `installed-suite` subsumed it by construction, and the premise was false on
# that record's own printed table. Coverage is counted, against real reverted
# defects, or it is a story.
#
# EVERY ROW BELOW WAS RE-MEASURED FOR THIS REGISTER RATHER THAN COPIED. Each
# breakage was reintroduced one at a time on a clean `git archive HEAD` export,
# a real sdist was built from it, and both environments were run through their
# literal command sequences.
#
# THE LIMITATION D-040 AND D-050 BOTH CARRIED IS OVER. Every row below is now
# measured on ubuntu under GitHub's `bash -e`: run 34099756605, 2026-09-07,
# ubuntu-latest, CPython 3.12, at commit 34925f8, replicated by run 33379084166
# on 2026-08-31 at the same commit. The two runs agree case for case.
#
# WHAT THE RUNNER DID NOT REPRODUCE. The 2-of-5 total holds. The 4-of-5 does
# not: the extracted tree now catches 5 of 5. Row `b` says why, and the cause is
# a test the heredoc extraction added rather than anything about ubuntu -- so
# the Windows figure was right when it was taken and the TREE moved under it.
# That is the same shape as `--evidence-provenance`: evidence with a date on it,
# and a file underneath that changed.

[[defect_coverage]]
id = "a"
summary = "bench/results.json left out of the sdist, so the shipped claims gate could not pass"
fixed_in = "9d6bb21"
caught_by = ["sdist_file_list", "sdist_extracted_tree_suite", "claims_in_sdist"]
missed_by = ["installed_expected_non_passing"]
measured_on = 2026-09-07
measured_in = "run 34099756605, ubuntu-latest, CPython 3.12, at 34925f8; replicated by run 33379084166"
note = """
The `test -f` line names it directly. The extracted-tree suite ALSO fails, on
tests/test_check_claims.py::TestThisRepository::test_the_checkout_is_green --
so the artifact carries its own detection and does not depend on the file list.
`installed-suite` cannot see it: the run directory holds no `bench/` for the
absence to be noticed in.
"""

[[defect_coverage]]
id = "b"
summary = "data/LICENSES.md left out of the sdist, so README and SECURITY link to nothing"
fixed_in = "ade807f"
caught_by = ["sdist_file_list", "sdist_extracted_tree_suite"]
missed_by = ["installed_expected_non_passing"]
measured_on = 2026-09-07
measured_in = "run 34099756605, ubuntu-latest, CPython 3.12, at 34925f8; replicated by run 33379084166"
note = """
THE ONE ROW THE RUNNER DID NOT REPRODUCE, AND THE CAUSE IS THIS REGISTER'S OWN
PREVIOUS ROUND.

Every other row is identical to the 2026-08-24 Windows measurement. This one
read `caught_by = ["sdist_file_list"]` and said the extracted-tree suite "passes
with the file gone, because no test reads it". Both runner runs report the
extracted tree FAILING on `b`, so the sentence is false on this tree and the
`test -f` line is no longer the entire net.

WHAT CHANGED, TRACED RATHER THAN GUESSED. The heredoc extraction added
tests/test_gate_scripts.py, whose TestSdistFileList asserts
`gate_sdist_files.missing(REPO_ROOT) == []`. In a checkout that is a statement
about the checkout; in the EXTRACTED TREE, REPO_ROOT is the artifact, so the
required-file list is enforced from inside the sdist as well as from ci.yml.
Verified in-process on 2026-09-08: `missing()` over a tree holding every
required path returns `[]`, and returns `data/LICENSES.md` with that one path
removed.

TWO HYPOTHESES WERE TESTED AND REFUTED FIRST, and both are recorded because a
mechanism that survived one guess is worth less than one that survived three.
`test_every_link_out_of_a_shipped_document_is_itself_shipped` does NOT catch it
-- `_LINKS_NOT_SHIPPED` exempts everything under `data/`, re-run in-process with
the manifest line removed and the dangling list stayed empty. Nor does
`test_every_file_the_claims_gate_reads_is_shipped_by_the_manifest`:
check_claims.SCAN_GLOBS does not name data/LICENSES.md.

NOBODY DESIGNED THIS AND NO ROUND CLAIMED IT. Extracting three heredocs was
costed as buying testability; it also moved one breakage's coverage, in a file
nobody was looking at, and the register would have gone on publishing 4 of 5
if the runner's table had not been read. The extraction's own record says
"extraction, not harvest" -- it was both, and only one half was noticed.
"""

