# ===========================================================================
# DEFECT COVERAGE -- how many known defects each gate actually catches
# ===========================================================================
# The shape of record every gate should carry, and the reason this table is
# here rather than a sentence: D-050 retired an AST guard on the premise that
# `installed-suite` subsumed it by construction, and the premise was false on
# that record's own printed table. Coverage is counted, against real reverted
# defects, or it is a story.
#
# EVERY ROW BELOW WAS RE-MEASURED FOR THIS REGISTER RATHER THAN COPIED. Each
# breakage was reintroduced one at a time on a clean `git archive HEAD` export,
# a real sdist was built from it, and both environments were run through their
# literal command sequences. The 2-of-5 and 4-of-5 totals D-050 recorded
# reproduce exactly. One REASON did not, and it is written into row `e`.
#
# Re-measurement conditions, stated because they are the same ones D-050 had
# and the same limitation applies: 2026-08-24, commit a62f99a, Windows,
# CPython 3.13, `Scripts/python.exe` for `bin/python`. Ubuntu under GitHub's
# `bash -e` is unexecuted, exactly as it was for D-040 and D-050.

[[defect_coverage]]
id = "a"
summary = "bench/results.json left out of the sdist, so the shipped claims gate could not pass"
fixed_in = "9d6bb21"
caught_by = ["sdist_file_list", "sdist_extracted_tree_suite", "claims_in_sdist"]
missed_by = ["installed_expected_non_passing"]
measured_on = 2026-08-24
measured_in = "a62f99a, Windows, CPython 3.13"
note = """
The `test -f` line names it directly. The extracted-tree suite ALSO fails, on
tests/test_check_claims.py::TestThisRepository::test_the_checkout_is_green --
so the artifact carries its own detection and does not depend on the file list.
`installed-suite` cannot see it: the run directory holds no `bench/` for the
absence to be noticed in.
"""

[[defect_coverage]]
id = "b"
summary = "data/LICENSES.md left out of the sdist, so README and SECURITY link to nothing"
fixed_in = "ade807f"
caught_by = ["sdist_file_list"]
missed_by = ["sdist_extracted_tree_suite", "installed_expected_non_passing"]
measured_on = 2026-08-24
measured_in = "a62f99a, Windows, CPython 3.13"
note = """
Caught by the `test -f` line and by NOTHING ELSE, re-confirmed here: the
extracted-tree suite passes with the file gone, because no test reads it. That
line is the entire net. Deleting it as tidy-up removes the only check on a file
two shipped documents cite as evidence.
"""

[[defect_coverage]]
id = "c"
summary = "tests/fixtures/*.json left out of the sdist, so the artifact's own suite could not start"
fixed_in = "ed05317"
caught_by = ["sdist_extracted_tree_suite", "installed_expected_non_passing"]
missed_by = ["sdist_file_list"]
measured_on = 2026-08-24
measured_in = "a62f99a, Windows, CPython 3.13"
note = """
The one breakage both environments catch. installed-suite went from 4,339
passed to 3,748 passed with 38 failures and 5 errors -- it is not subtle there.
"""

[[defect_coverage]]
id = "d"
summary = "tests/test_governed_gold.py loads bench/run_governed_gold.py at module level, unguarded"
fixed_in = "b9bf728"
caught_by = ["sdist_extracted_tree_suite", "installed_expected_non_passing"]
missed_by = ["sdist_file_list"]
measured_on = 2026-08-24
measured_in = "a62f99a, Windows, CPython 3.13"
note = """
A `pytest.mark.skipif` cannot save a module body that already ran: the mark is
consulted at collection and the body runs at import, which is earlier.
"""

[[defect_coverage]]
id = "e"
summary = "tests/test_splits_manifest.py loads bench/corpora.py at module level, unguarded"
fixed_in = "da8b222"
caught_by = ["sdist_extracted_tree_suite"]
missed_by = ["sdist_file_list", "installed_expected_non_passing"]
measured_on = 2026-08-24
measured_in = "a62f99a, Windows, CPython 3.13"
note = """
THE ROW WHOSE REASON CHANGED, AND THE REASON IS THE FINDING.

D-050 measured `installed-suite` missing this and attributed it to the
file-keyed EXPECTED_NON_PASSING entry: while a FILE sits on that list the job
cannot see a second defect anywhere in it. D-058 deleted both file-keyed
entries and replaced them with narrow module-level skips, and its own closing
note reads as though the blind spot went with them.

It did not. Re-measured here, `e` is STILL missed, and the log says why:

    SKIPPED [1] tests/test_splits_manifest.py:133: tools/ is not part of an
    installed distribution; these tests belong to a checkout

The skip fires at line 133. The unguarded load is at line 143. The module never
reaches it. The blind spot moved from a list of names in ci.yml into a skip
condition in the test file -- same shape, one absorbing condition upstream of
the defect -- and the counts are identical to a clean run in both cases, which
is exactly what made the original instance hard to see.

That is not an argument against the narrow skips: they are strictly better than
the file-keyed entries, because any OTHER error in the file now reaches the
job. It is an argument against reading "the list shrank" as "the coverage
grew". It did not grow. It is 2 of 5 before and 2 of 5 after.
"""
