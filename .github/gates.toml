note = """
THE MOST IMPORTANT MUTATION IN THIS FILE, AND THE ONE THAT IS EXPECTED TO COME
BACK `INERT` LOCALLY. It restores D-058's cause one exactly: a control asserting
on the path `_sdu22_ae_source` returns, instead of on the filename both
outcomes name. On a runner `data/` is absent, the call raises `SystemExit`
before returning anything, and the suite fails. On a developer machine with
`data/` fetched it passes, so this harness reports INERT there -- correctly.
The disagreement between the two runs is the demonstration, not a defect in the
probe. `verified_locally_on` is deliberately UNSET: a laptop run of this one is
not a verification and recording it as one would be the exact confusion R11
exists to end.

MEASURED BOTH WAYS ON 2026-08-24, on one clean export of HEAD, by moving `data/`
aside between two runs of `pytest tests/test_splits_manifest.py`:

    data/ present  (a developer machine)   88 passed
    data/ absent   (a CI runner)           1 failed, 87 passed
      FAILED TestTheRealManifest::test_the_reader_that_would_spend_the_allocated_arm_is_wired

Same tree, same suite, same defect, opposite verdicts. That is the whole of R11
in one table, and it is the prediction `test-gates` exists to check in situ.

THE PREDICTION WAS CHECKED AND IT HELD -- AND THE RUN FOUND SOMETHING THE
PREDICTION DID NOT COVER. Run 32808357572, ubuntu-latest, CPython 3.12.14,
`data/` absent, this mutation applied:

    2 failed, 4861 passed, 11 skipped, 1 xfailed in 60.57s     (mutated, rc=1)
    FAILED tests/test_splits_manifest.py::TestTheRealManifest::
           test_the_reader_that_would_spend_the_allocated_arm_is_wired
           SystemExit: missing .../data/sdu22_ae_legal_dev.json

That is the predicted failure, by name, in the predicted environment. The
SECOND failure is not:

    FAILED tests/test_gate_manifest.py::TestTheRegisterThisRepositoryShips::
           test_it_validates -- assert ['gates.suite...ne described'] == []

The probe edits `tests/test_splits_manifest.py`, which is the anchor
`gates.suite`'s own register entry names -- so the register's validator
correctly reports the anchor no longer matches. THE DEMONSTRATION IS THEREFORE
CONFOUNDED: the suite would have gone red on that second test even if the
D-058 defect had not been restored, so `rc=1` alone does not establish that
this gate catches this defect. What establishes it is the named FAILED line
above, and a reader should take the evidence from the line rather than from the
verdict. Fixing this needs a probe that does not edit a file the register
anchors on; it is not done.
"""
