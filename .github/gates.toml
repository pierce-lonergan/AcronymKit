Divergence between schemas/acronym-engine-result.schema.json and the copy
bundled into the wheel. Two copies of one contract is how a shipped validator
comes to accept what the documented schema rejects.
"""
[gates.schema_copies_match.mutation]
kind = "automated"
expect = "fail"
expect_failure_matching = "SCHEMA COPIES DIVERGED"
artifact = "resources/schema_copies.log"
verified_locally_on = 2026-08-25
verified_in_situ_on = 2026-09-07
verified_in_situ_run = "34099756605"
verified_in_situ_commit = "34925f8"
note = """
EXTRACTED. This was `kind = "inline"` and the refusal read: "the gate is a
heredoc inside ci.yml with no command a runner can invoke, so this harness could
only run a COPY of it". `tools/gate_schema_copies.py` is that heredoc with a
name; ci.yml invokes it and so does this mutation.

THE EXTRACTION FIRED THE GATE ON ITS FIRST INVOCATION, on the developer machine,
against an UNMUTATED tree. `.gitattributes` declares `*.json text eol=lf` and
says in its own comment that the reason is "the CI job that asserts the two
copies of the interchange schema are identical"; `git ls-files --eol` reported
`w/crlf` for schemas/acronym-engine-result.schema.json and `w/lf` for the
bundled copy, so the two differed by 161 bytes of line ending and this gate was
RED in that working tree. Nothing could observe it, because there was no command
to run. `git status` stayed clean throughout, because git compares normalised
content. Repaired by rewriting the working copy to LF, which is byte-identical
to HEAD -- a working-tree repair, not a commit.

The mutation is ONE APPENDED NEWLINE. That is deliberate rather than minimal for
its own sake: `tests/test_serialization.py` already asserts the two copies are
SEMANTICALLY equal, and a trailing newline passes that test and fails this gate.
The one-byte divergence is exactly the coverage this gate has that the test does
not.
"""
edits = [
  { file = "src/acronymkit/resources/acronym-engine-result.schema.json", append = "\n" },
]


