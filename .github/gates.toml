"""
detects = """
That this harness can still tell a failure from a pass. The edit makes
`--check` red by giving a gate an unknown key; if the harness reports anything
but `demonstrated`, its detector is broken and every other row it printed is
worthless.
"""
[gates.control_always_red.mutation]
kind = "automated"
expect = "fail"
artifact = "controls/always-red.log"
verified_locally_on = 2026-08-24
