note = """
The one breakage both environments catch. installed-suite went from 4,339
passed to 3,748 passed with 38 failures and 5 errors -- it is not subtle there.
"""

[[defect_coverage]]
id = "d"
summary = "tests/test_governed_gold.py loads bench/run_governed_gold.py at module level, unguarded"
fixed_in = "b9bf728"
caught_by = ["sdist_extracted_tree_suite", "installed_expected_non_passing"]
missed_by = ["sdist_file_list"]
measured_on = 2026-09-07
measured_in = "run 34099756605, ubuntu-latest, CPython 3.12, at 34925f8; replicated by run 33379084166"
note = """
A `pytest.mark.skipif` cannot save a module body that already ran: the mark is
consulted at collection and the body runs at import, which is earlier.
"""

[[defect_coverage]]
id = "e"
summary = "tests/test_splits_manifest.py loads bench/corpora.py at module level, unguarded"
fixed_in = "da8b222"
caught_by = ["sdist_extracted_tree_suite"]
missed_by = ["sdist_file_list", "installed_expected_non_passing"]
measured_on = 2026-09-07
measured_in = "run 34099756605, ubuntu-latest, CPython 3.12, at 34925f8; replicated by run 33379084166"
note = """
THE ROW WHOSE REASON CHANGED, AND THE REASON IS THE FINDING.

D-050 measured `installed-suite` missing this and attributed it to the
file-keyed EXPECTED_NON_PASSING entry: while a FILE sits on that list the job
cannot see a second defect anywhere in it. D-058 deleted both file-keyed
entries and replaced them with narrow module-level skips, and its own closing
note reads as though the blind spot went with them.

It did not. Re-measured here, `e` is STILL missed, and the log says why:

    SKIPPED [1] tests/test_splits_manifest.py:133: tools/ is not part of an
    installed distribution; these tests belong to a checkout

The skip fires at line 133. The unguarded load is at line 143. The module never
reaches it. The blind spot moved from a list of names in ci.yml into a skip
condition in the test file -- same shape, one absorbing condition upstream of
the defect -- and the counts are identical to a clean run in both cases, which
is exactly what made the original instance hard to see.

That is not an argument against the narrow skips: they are strictly better than
the file-keyed entries, because any OTHER error in the file now reaches the
job. It is an argument against reading "the list shrank" as "the coverage
grew". It did not grow. It is 2 of 5 before and 2 of 5 after.
"""

