verified_locally_on = 2026-08-25
verified_in_situ_on = 2026-09-07
verified_in_situ_run = "34099756605"
verified_in_situ_commit = "34925f8"
note = """
EXTRACTED, AND THE EXTRACTION ALONE WAS NOT ENOUGH -- WHICH REFUTES THIS
REGISTER'S OWN COSTING OF IT. Both this entry and docs/GATES.md said three
inline gates "go together in one afternoon" and that this one was "blocked on
the same extraction" as the other two. Measured: it is not. `ci.yml`'s
`import-time` job installs the package NON-EDITABLY, on purpose -- "an editable
install adds a path finder of its own, and what is being measured is what a user
actually installs" -- so an edit to `src/acronymkit/__init__.py` never reaches
the interpreter this gate measures. The mutation would have been INERT in this
gate's own environment by construction, and would have read as the gate being
blind when the harness had simply not touched what the gate looks at.

`setup` above is the fix, and it is a new field this round added for exactly one
gate. It re-installs the mutated source the way the job installs it, before the
gate runs, and again after the restore.

THE MUTATION IS NOT THE ONE THE OLD REFUSAL NAMED. It said `import pydantic`.
Pydantic is not installed in a base-only environment, so that import would raise
and the gate would exit non-zero for a reason it does not describe -- a false
demonstration. An eager `from . import enums` binds `acronymkit.enums`, which the
structural half rejects by name, and it needs nothing installed.

ONLY THE STRUCTURAL HALF IS DEMONSTRATED. No edit to this tree reliably takes a
~2 ms import past the 30 ms ceiling without breaking the structural half first,
so the wall-clock half of this gate has never been shown able to fail and is not
claimed to have been.
"""
edits = [
  { file = "src/acronymkit/__init__.py", find = "from __future__ import annotations", replace = "from __future__ import annotations\n\nfrom . import enums as _gate_probe_eager  # noqa: F401  -- gates.import_ceiling probe" },
]


