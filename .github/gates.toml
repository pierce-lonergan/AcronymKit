verified_in_situ_commit = "34925f8"
note = """
EXTRACTED, and the mutation is the one the previous refusal named: an eager
`import click` at module scope in `src/acronymkit/__init__.py`.

THE SAME DEFECT FIRES A DIFFERENT HALF OF THIS GATE IN EACH ENVIRONMENT, and
that is why `expect_failure_matching` is a marker the script prints rather than
a message either half produces. On a developer machine `click` is installed, the
import succeeds, and the sys.modules leak assertion fires. On `ci.yml`'s
`zero-dependency` runner nothing optional is installed, so the import RAISES and
the "Tier 0 must run at all" assertion fires. Both are this gate detecting this
defect; neither message is the other's.

WHERE `verified_locally_on` CAME FROM, because it is narrower than it looks.
Against the ambient interpreter of the machine that recorded it, this mutation
came back INERT -- `acronymkit` happened to be installed NON-editably there, so
the edit to `src/` never reached the import. The DEMONSTRATED run is against a
venv built the way `ci.yml`'s zero-dependency job builds one (`pip install -e
"."`, no extras), where the mutation raises `ModuleNotFoundError: No module
named 'click'` and the marker is printed. Neither run is R11 evidence.

WHAT THIS GATE CANNOT DISTINGUISH, named rather than left to be discovered: a
leak caused by the package and a leak caused by the ENVIRONMENT having click
installed produce the same failure. The job's `pip install -e "."` is the only
thing holding that premise, and `--assert-environment` checks path globs, so
nothing here can assert it.
"""
