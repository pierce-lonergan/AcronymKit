  { file = ".github/gates.toml", find = "artifact = \"controls/always-green.log\"", replace = "artifact = \"controls/always-green.log\"\nthis_key_is_never_allowed = true" },
]

[gates.control_always_green]
environment = "mutation_controls"
step = "Negative control - a mutation that must NOT be demonstrated"
command = "python tools/gates.py --check --path .github/gates.toml"
defect_class = "positive_control"
cost_rank = 30
blast_radius = "evidence_apparatus"
silence = "silent"
redundancy = "partial"
cost_if_inert = """
The negative control on the mutation harness's detector. Inert, a harness that has rotted into
reporting `demonstrated` for everything passes every other row it prints. Paired with
control_always_red, which checks the other direction.
"""
detects = """
A harness that has rotted into reporting `demonstrated` for everything. The
edit is a comment: it changes a byte and cannot change an outcome, so this gate
MUST come back `INERT`. `expect = "pass"` is what says so, and the harness
fails the run if the gate goes red instead.

This is the one row in the file whose red is good news.
"""
[gates.control_always_green.mutation]
