# The cold-read ledger: what every second reader found, and what happened to it.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# `docs/SECOND-READER.md` section 5 said, in a sentence, that a cold reader who
# starts editing another workstream's page "stops being cold and starts being a
# seventh author of it". On the policy's first execution the reader edited a
# page another workstream had written that same round, and flagged itself for
# doing so. THE SENTENCE DID NOT HOLD IT, AND IT WOULD NOT HOLD IT NEXT TIME.
#
# So the boundary is here instead of there. The reader's whole output is this
# file. `disposition = "fixed"` requires an `applied_by` that is NOT the reader
# who raised the finding, so a reader cannot close its own finding by editing
# prose -- closing takes a second name. That is the read-only half.
#
# The other half is the one that actually decides whether this is worth doing.
# A read-only reviewer whose findings rot is worse than one who fixes things,
# and this repository has the measurement: the first pass found two pages
# claiming the air-gap job drives "every CLI subcommand" while the probe drives
# thirteen of the sixteen, and one round later it was unaltered in all three
# places -- AFTER somebody had found it and written down where it is. The rule
# that answers that is in `tools/second_reader.py`:
#
#   * a finding is born `open`;
#   * an `open` finding is re-affirmed at EVERY cold read (`reviewed_in` names
#     the newest read), which costs one field and cannot be forgotten quietly;
#   * an `open` finding may survive at most OPEN_READ_LIMIT reads. On the next
#     one it is `fixed`, or `blocked` naming a decision, or `permanent` naming a
#     reason (R14). It never stops being a finding. It stops being silent.
#
# Nothing here forces anybody to apply anything. A reader who could assign work
# to strangers would be authoring by another route.
#
# ---------------------------------------------------------------------------
# HOW TO ADD TO IT
# ---------------------------------------------------------------------------
#   python tools/second_reader.py --trigger   # the files this round touched
#   python tools/second_reader.py --open      # the apply worklist
#   python tools/second_reader.py --check     # the gate; run it after editing
#
# `--check` is validated by `tests/test_second_reader_policy.py`, which
# mutation-tests every rule below rather than asserting that they hold.
#
# ---------------------------------------------------------------------------
# WHAT IS TRANSCRIBED HERE AND WHAT WAS RE-DERIVED
# ---------------------------------------------------------------------------
# Both recorded reads predate this file, so their headers are TRANSCRIBED from
# `docs/DECISIONS.md` (D-060, D-072) and from section 8 of the policy page --
# `transcribed_from` says so per read, and no cold read is claimed that did not
# happen. Every FINDING below was re-run on the tree of 2026-08-25 before being
# entered; the `refutation` field is the command that was actually executed, not
# the command the earlier record published. One of the earlier published
# refutations does not refute what it was published beside, and the corrected
# one is in F-2026-08-25-02.
#
# There is no `fixed` finding here, and `--check` prints that count on every run
# rather than leaving the absence to be noticed. The six fixes the second read
# shipped were made by the reader itself under the superseded section 5 fix
# clause; entering them as `fixed` would require naming that reader as
# `applied_by`, which the rule above refuses on purpose. They are described in
# reads[1].note instead of being re-shaped to fit.

[ledger]
schema_version = 1
policy = "docs/SECOND-READER.md"


# ===========================================================================
# READS
# ===========================================================================

