[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acronymkit"
version = "0.2.0"
description = "Enterprise-grade text-to-acronym generation, extraction, and disambiguation engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pierce Lonergan", email = "lonerganpierce@gmail.com" }]
keywords = [
    "acronym",
    "abbreviation",
    "backronym",
    "nlp",
    "text-processing",
    "schwartz-hearst",
    "disambiguation",
    "naming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
cli = ["click>=8.0.0"]
nlp = ["spacy>=3.5.0", "nltk>=3.8.0"]
transformers = ["onnxruntime>=1.14.0", "transformers>=4.25.0"]
all = ["acronymkit[cli,nlp,transformers]"]
dev = [
    "acronymkit[cli]",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "jsonschema>=4.17.0",
    "hypothesis>=6.80.0",
    # The two linters are pinned to a minor range, and everything else is not,
    # because they are the only dev dependencies whose *new releases change
    # whether the build passes*. Both have now reded CI for a rule that did not
    # exist when the code was written and that no local run could have caught:
    # mypy dropped `python_version = "3.9"` and turned a needed `type: ignore`
    # into an unused one, and ruff added RUF036 and flagged a union written
    # months earlier. In both cases the failing commit had nothing to do with
    # the failure.
    #
    # This repository already pins every GitHub Action by commit SHA for the
    # same reason. Letting the linters float was the same decision made the
    # other way by omission. New rules are worth adopting -- deliberately, in a
    # commit that says so and fixes what they find, not in whatever commit
    # happens to be pushed the morning a release lands.
    "ruff>=0.14.8,<0.15",
    "mypy>=1.19.0,<2",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
acronymkit = "acronymkit.cli:main"

[project.urls]
Homepage = "https://github.com/pierce-lonergan/AcronymKit"
Documentation = "https://github.com/pierce-lonergan/AcronymKit#readme"
Repository = "https://github.com/pierce-lonergan/AcronymKit.git"
Issues = "https://github.com/pierce-lonergan/AcronymKit/issues"
Changelog = "https://github.com/pierce-lonergan/AcronymKit/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acronymkit = ["py.typed", "resources/*.json", "resources/*.txt", "resources/*.gz"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that take a noticeable amount of wall-clock time",
    "nlp: requires an optional Tier 1 NLP backend (spaCy or NLTK)",
]

[tool.coverage.run]
source = ["acronymkit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "UP006",  # keep typing.Dict/List compatibility where deliberate
    "UP007",  # Union[...] rather than X | Y for 3.9 support
    "UP045",  # Optional[X] rather than X | None for 3.9 support (split out of UP007)
    "UP035",
    "B905",   # zip(strict=...) is 3.10+
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.mypy]
# 3.10, not 3.9, and the difference is that this line now does something.
# mypy dropped support for `python_version = "3.9"`: current versions print
# "Python 3.9 is not supported (must be 3.10 or higher)" and carry on against
# the running interpreter's typeshed. So the setting read as if the codebase
# were being checked against its own floor while it silently was not -- and it
# broke a build, because a `type: ignore` written for the 3.9 typeshed is an
# *unused* ignore against the newer one.
#
# 3.9 support is real and stays; it is enforced where it can be, by the 3.9
# cells of the CI test matrix, which run the suite on the interpreter itself.
# A type checker asserting a floor it refuses to model is worse than one that
# says plainly which version it is modelling.
python_version = "3.10"
files = ["src/acronymkit"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
