[build-system]
# setuptools >= 77 is required, not merely preferred: it is the first release
# that understands PEP 639's `license = "<SPDX expression>"`, and PyPI now
# REJECTS what older setuptools emits. See the `license` field below.
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acronymkit"
version = "0.3.0"
description = "Governed acronym expansion against a catalog you supply, reporting what it cannot account for as unknown; generation, extraction and disambiguation measured beside it."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 SPDX expression, not `{ text = "MIT" }`, and the difference is that
# the old form no longer uploads. `{ text = ... }` emits a bare `License: MIT`
# header; combined with Metadata-Version 2.4 and a `License ::` classifier,
# PyPI's upload endpoint answers `400 Bad Request` — which is exactly how the
# first publish of this package failed. The classifier is gone from the list
# below for the same reason: under PEP 639 the expression is the license and a
# `License ::` classifier alongside it is a contradiction PyPI refuses.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pierce Lonergan", email = "lonerganpierce@gmail.com" }]
keywords = [
    "acronym",
    "abbreviation",
    "backronym",
    "nlp",
    "text-processing",
    "schwartz-hearst",
    "disambiguation",
    "naming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
cli = ["click>=8.0.0"]
nlp = ["spacy>=3.8.16", "nltk>=3.8.0"]
transformers = ["onnxruntime>=1.14.0", "transformers>=4.25.0"]
all = ["acronymkit[cli,nlp,transformers]"]
dev = [
    "acronymkit[cli]",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "jsonschema>=4.17.0",
    "hypothesis>=6.80.0",
    # The two linters are pinned to a minor range, and everything else is not,
    # because they are the only dev dependencies whose *new releases change
    # whether the build passes*. Both have now reddened CI for a rule that did
    # not exist when the code was written and that no local run could have
    # caught: a mypy release turned a needed `type: ignore` into an unused one
    # under a newer typeshed, and ruff added RUF036 and flagged a union written
    # months earlier. In both cases the failing commit had nothing to do with
    # the failure.
    #
    # CORRECTED IN PLACE. This used to attribute the mypy break to mypy having
    # "dropped `python_version = \"3.9\"`". That was wrong, or has stopped being
    # true: mypy 1.19.0 accepts the setting in a config file, warns about
    # nothing, and type-checks against 3.9's typeshed. The break was the
    # typeshed change alone. The claim is left visible because it did not stay
    # in this comment -- it was carried into `[tool.mypy]` below as the reason
    # to raise the floor to 3.10, where it silently stopped the checker
    # modelling the version this package claims to support, and a 3.10-only
    # stdlib call shipped through the gap. A wrong sentence in a config comment
    # is not decoration; this one changed a setting.
    #
    # This repository already pins every GitHub Action by commit SHA for the
    # same reason. Letting the linters float was the same decision made the
    # other way by omission. New rules are worth adopting -- deliberately, in a
    # commit that says so and fixes what they find, not in whatever commit
    # happens to be pushed the morning a release lands.
    "ruff>=0.14.8,<0.15",
    "mypy>=1.19.0,<2",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
acronymkit = "acronymkit.cli:main"

[project.urls]
Homepage = "https://github.com/pierce-lonergan/AcronymKit"
Documentation = "https://github.com/pierce-lonergan/AcronymKit#readme"
Repository = "https://github.com/pierce-lonergan/AcronymKit.git"
Issues = "https://github.com/pierce-lonergan/AcronymKit/issues"
Changelog = "https://github.com/pierce-lonergan/AcronymKit/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acronymkit = ["py.typed", "resources/*.json", "resources/*.txt", "resources/*.gz"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that take a noticeable amount of wall-clock time",
    "nlp: requires an optional Tier 1 NLP backend (spaCy or NLTK)",
]

[tool.coverage.run]
source = ["acronymkit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "UP006",  # keep typing.Dict/List compatibility where deliberate
    "UP007",  # Union[...] rather than X | Y for 3.9 support
    "UP045",  # Optional[X] rather than X | None for 3.9 support (split out of UP007)
    "UP035",
    "B905",   # zip(strict=...) is 3.10+
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.mypy]
# BACK TO 3.9, WHICH IS `requires-python`, AND THE PREVIOUS RATIONALE HAD GONE
# STALE. This said mypy had dropped `python_version = "3.9"` -- that current
# versions print "Python 3.9 is not supported (must be 3.10 or higher)" and
# carry on against the running interpreter's typeshed -- and that the override
# was therefore honest about a floor mypy refused to model. Re-tested against
# the pinned mypy (1.19.0): the config-file form is accepted with no warning,
# 3.9's typeshed is used, and `mypy` over `src/acronymkit` is clean at 3.9. The
# `type: ignore` collision that forced the move has since been resolved
# elsewhere. So the setting bought nothing and cost the floor.
#
# It cost something concrete. `Path.write_text(newline=...)` is 3.10+, and a
# call to it shipped, type-checked clean, passed every local gate and failed
# only on the 3.9 cells of the CI matrix. At 3.9 mypy names it exactly:
# `Unexpected keyword argument "newline" for "write_text" of "Path"`.
#
# THAT HOLE IS NOW CLOSED, AND THE PARAGRAPH THAT MEASURED IT WAS ITSELF
# MEASURED AT THE WRONG FLOOR. This used to read: "`files` below is
# `src/acronymkit` only, so the call that actually broke -- in `tools/` -- is
# still unchecked at any version. Extending `files` to `tools` and `bench`
# reports 51 errors across 14 files at this strictness." Re-derived on the tree
# that sentence was written against, `51` errors in `14` files is what
# `python_version = "3.10"` reports -- the setting the same commit deleted three
# lines above. At the `3.9` floor the same command reports `54` errors in `17`
# files, and the three extra errors ARE the defect the paragraph is about:
#
#   tools/fetch_data.py:1355            Unexpected keyword argument "newline"
#   tools/build_lexicons.py:202         Unexpected keyword argument "newline"
#   tools/build_reliability_table.py:254   Unexpected keyword argument "newline"
#
# The commit that fixed `Path.write_text(newline=...)` said "tools/ -- where all
# five bad calls were". Five were, all of them in the one file that round had
# just written; three older ones in three other files were never looked for. So
# the debt figure quoted as the reason not to extend the checker was produced by
# a checker configured not to see the defect. All three are fixed here.
#
# `tools` and `bench` are now in `files`, so `python -m mypy` -- the exact CI
# invocation, no arguments -- covers them at the `3.9` floor. `tools/` takes the
# same strictness as `src/acronymkit`, with no override of any kind: every
# defect of this class so far has been in `tools/`, and relaxing the directory
# the defects live in would move the boundary rather than close it.
python_version = "3.9"
files = ["src/acronymkit", "tools", "bench"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# THE REAL REASON THE FLOOR HAD BEEN RAISED TO 3.10, FOUND BY CI RATHER THAN BY
# READING. At `python_version = "3.9"` mypy follows imports into installed
# third-party source, and current `click` uses `match` statements:
#
#   click/utils.py: error: Pattern matching is only supported in Python 3.10
#   and greater  [syntax]
#   Found 1 error in 1 file (errors prevented further checking)
#
# It is a hard stop -- "errors prevented further checking" -- so the whole run
# dies on a dependency's syntax, not on ours. This did not reproduce locally
# because the resolved `click` there is `8.1.8`, which predates the `match`.
# Same class as the pinning note above: a floating dependency deciding whether
# the build passes, and it is why that note is worth reading twice.
#
# `follow_imports = "skip"` treats `click` as `Any` rather than parsing it.
# Verified as the mechanism, not assumed: a scratch dependency with a `match`
# statement reproduces the exact error at 3.9 and is silenced by this override.
# The cost is real and small -- calls into `click` are no longer type-checked --
# and it is the right trade against losing the floor for the whole package.
# `src/acronymkit/cli.py` imports `click` inside a function, so the surface is
# one module's optional path.
[[tool.mypy.overrides]]
module = ["click", "click.*"]
follow_imports = "skip"

# THE ONLY STRICTNESS RELAXATION, AND IT IS THREE NAMED MODULES RATHER THAN A
# DIRECTORY. `disallow_untyped_defs` accounts for 16 of the 54 errors extending
# `files` reported, all of them in these three analysis runners: local closures
# passed as `sorted`/`max` keys, two hand-written `__init__` bodies, and
# harness-side predicates. Annotating them is worth doing and is not worth
# blocking the coverage on, so it is booked as debt with a number rather than
# hidden.
#
# `check_untyped_defs = true` is the half that keeps this from being a hole.
# Without it mypy does not look INSIDE an unannotated function at all, so
# dropping `disallow_untyped_defs` alone would have taken 16 function bodies out
# of the check while the run still printed success -- a weakened check reporting
# green, which is worse than no check. With it the bodies are still analysed and
# only the signature requirement is dropped.
#
# The list is modules, not a wildcard, on purpose: a NEW unannotated function in
# any other `bench/` runner is still an error. Removing a name from this list is
# how the debt gets paid, one file at a time.
[[tool.mypy.overrides]]
module = [
    "bench.run_shortform",
    "bench.run_disambiguation_diagnosis",
    "bench.run_cascade",
]
disallow_untyped_defs = false
check_untyped_defs = true
